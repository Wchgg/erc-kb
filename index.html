{id:'facility-power', p:'facility', t:'电力'},
{id:'facility-water', p:'facility', t:'水课'},
{id:'facility-gas', p:'facility', t:'气化'},
{id:'facility-integration', p:'facility', t:'系统整合'}
]};
var ORG_SVG_CACHE = null;
function orgSVG(){
if(ORG_SVG_CACHE) return ORG_SVG_CACHE;
var byId={};
ERO.nodes.forEach(function(n){ byId[n.id]=n; });
function kidsOf(id){ var r=[]; ERO.nodes.forEach(function(n){ if(n.p===id) r.push(n.id); }); return r; }
var groups = kidsOf('ic');
// compact layout: the nine groups are packed into two rows and each group's
// members stack directly beneath its group box, instead of one wide tree line
var rows=[[],[]];
groups.forEach(function(g,i){ rows[i<5?0:1].push(g); });
var BW=112, GBH=42, MBH=34, MGAP=6, CGAP=14, PITCH=124, X0=42, PAD=16;
var ICW=140, ICH=46;
function colH(g){ var k=kidsOf(g); return GBH + (k.length? CGAP + k.length*MBH + (k.length-1)*MGAP : 0); }
function rowH(r){ var m=0; r.forEach(function(g){ var h=colH(g); if(h>m) m=h; }); return m; }
var maxCols=0; rows.forEach(function(r){ if(r.length>maxCols) maxCols=r.length; });
var areaW = maxCols*BW + (maxCols-1)*(PITCH-BW);
var W = X0 + areaW + PAD;
function colX(i){ return X0 + i*PITCH; }
function colCX(i){ return colX(i)+BW/2; }
var icCX = X0 + areaW/2;
var icY = PAD;
var bus1Y = icY + ICH + 22;
var row1Y = bus1Y + 18;
var H1 = rowH(rows[0]);
var bus2Y = row1Y + H1 + 40;
var row2Y = bus2Y + 18;
var H2 = rowH(rows[1]);
var H = row2Y + H2 + PAD;
var spineX = 20;
var s='';
s+='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="紧急应变组织（ERO）组织图">';
// connectors: IC trunk, left spine joining both row buses, per-row bus + drops,
// and a short vertical line from each group box down through its stacked members
s+='<path d="M'+icCX+' '+(icY+ICH)+' V'+bus1Y+'" fill="none" stroke="var(--muted)" stroke-width="1.6"></path>';
s+='<path d="M'+spineX+' '+bus1Y+' V'+bus2Y+'" fill="none" stroke="var(--muted)" stroke-width="1.6"></path>';
rows.forEach(function(r, ri){
var busY = ri===0? bus1Y : bus2Y;
var topY = ri===0? row1Y : row2Y;
s+='<path d="M'+spineX+' '+busY+' H'+colCX(r.length-1)+'" fill="none" stroke="var(--muted)" stroke-width="1.6"></path>';
r.forEach(function(g, i){
var cx = colCX(i);
s+='<path d="M'+cx+' '+busY+' V'+topY+'" fill="none" stroke="var(--muted)" stroke-width="1.6"></path>';
var k = kidsOf(g);
if(k.length){
var lastCenter = topY + GBH + CGAP + (k.length-1)*(MBH+MGAP) + MBH/2;
s+='<path d="M'+cx+' '+(topY+GBH)+' V'+lastCenter+'" fill="none" stroke="var(--muted)" stroke-width="1.4"></path>';
}
});
});
// IC box
s+='<rect x="'+(icCX-ICW/2)+'" y="'+icY+'" width="'+ICW+'" height="'+ICH+'" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.6"></rect>';
s+='<text x="'+icCX+'" y="'+(icY+ICH/2+5)+'" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">'+esc(byId['ic'].t)+'</text>';
// group boxes with their members stacked directly underneath
rows.forEach(function(r, ri){
var topY = ri===0? row1Y : row2Y;
r.forEach(function(g, i){
var x = colX(i), cx = colCX(i);
s+='<rect x="'+x+'" y="'+topY+'" width="'+BW+'" height="'+GBH+'" rx="9" fill="var(--surface2)" stroke="var(--ink)" stroke-width="1.6"></rect>';
s+='<text x="'+cx+'" y="'+(topY+GBH/2+5)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">'+esc(byId[g].t)+'</text>';
kidsOf(g).forEach(function(m, j){
var my = topY + GBH + CGAP + j*(MBH+MGAP);
s+='<rect x="'+x+'" y="'+my+'" width="'+BW+'" height="'+MBH+'" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"></rect>';
s+='<text x="'+cx+'" y="'+(my+MBH/2+4.5)+'" text-anchor="middle" font-size="12.5" fill="var(--ink)">'+esc(byId[m].t)+'</text>';
});
});
});
s+='</svg>';
ORG_SVG_CACHE=s;
return s;
}
function orgBody(){
var h='<p>事故指挥官在最上层，往下展开各组组长与组员；层级：一级、二级、三级。</p>';
h+='<div class="flow-scroll">'+orgSVG()+'</div>';
h+='<p class="flow-hint">图面较宽时可在此框内左右滑动查看。</p>';
return h;
}
var MICRON = [{"title": "应变组织与角色执掌", "text": "引言 — 序\n紧急应变中心(ERC)主要负责管理厂内的消防及紧急应变业务。ERC所建置的防灾整合系统能够连结厂务供应状态，并整合各类防灾警报讯息，作为灾变时的指挥中枢。\n根据《消防法施行细则》第15条第一项自卫消防编组施行细则第五条规定，厂内需建立灭火班、通报班、避难引导班、安全防护班及救护班等自卫消防编组，这些编组任务由紧急应变中心(ERC)训练各组职掌，确保在灾害发生的第一时间能够有效启动救灾任务。\n紧急应变中心(ERC)团队致力于撰写厂区应变紧急指引方针，并建立应变共通语言-灾害现场抢救标准作业程序 H.A.Z.M.A.T 以图文并茂方式，让同仁在平时及灾时能够迅速了解并遵循快速应变指引，确保各阶段的任务分配得以顺利进行，并让同仁了解不同灾害所需应变的技巧及注意事项。\nChapter 01 厂区应变组织介绍\n1.1 紧急应变组织架构图\n\n[TABLE 2 | 3 rows]\n事故阶级 | 一阶事故 | 二阶事故 | 假日/非正常班值班\n指挥官对象 | 事故部门 M2 主管 | 事故部门 M3 主管 | ERC/ERT 值班代理\n三阶事故 | 总指挥官（厂长）进驻，请求外部支援 | 安全幕僚：EHS/ME/CC team | 监控中心：ERC/CCR\n[/TABLE]\n\n组织架构阶层说明：\n最高指挥层：总指挥官（厂长）→ 事故指挥官（事故部门主管），旁设「安全幕僚 (EHS/ME/CC team)」与「监控中心 (ERC/CCR)」。\n平行功能分组：保全组、厂务组（空/水/气/电）、ERT现场指挥官 (ERC/ERT Team)、疏散组（下辖避难引导班、安全防护班）、计划组、公关组、财务组、后勤组。\nERT 现场指挥官下辖紧急应变组 (ERT team)：抢救组、支援组、管制组、急救组、通报组。\n一、二阶事故由厂内应变；三阶事故或灾害扩大时启动「请求外部支援」。\n1.2 各角色任务执掌\n\n[TABLE 3 | 19 rows]\n组织角色 / 编组 | 任务执掌明细\n总指挥官(厂长) | • 进驻监控中心• 掌握异常事件• 确认应变目标\n事故部门指挥官 | • 评估及确认现场风险危害• 确认应变目标• 发展行动计划\n安全幕僚(EHS/ME/CC team) | • 提供指挥官即时应变资讯及建议• 主管机关及外部支援单位通报• 联防支援器材的接收及清点\n监控中心(ERC/CCR) | • 在意外事故紧急处理及控制过程中，负责接收/传递资讯• 依照简讯通报流程发送意外事故/虚惊事件简讯\n保全组 | • 外部支援单位/机关车辆引导• 外部救援单位车辆引导\n厂务组(空/水/气/电) | • 通报EHS污染防治设备故障与修复状况• 通报EHS大量污染物排放状况及控制情形• 视灾区影响区域进行厂内通报\n疏散组 - 避难引导班 | • 引导人员进行逃生疏散• 人员清点与安全回报\n疏散组 - 安全防护班 | • 人员管制• 现场障碍物移除或通报• 关闭楼层防火门\n计划组 | • 研拟营运持续计划 (BCP注2)• 研拟灾后复原计划\n公关组 | • 对外发言及新闻稿发送\n财务组 | • 事故灾害财务损失计算• 编列灾害复原预算• 联系保险公司评估理赔事宜\n后勤组 | • 区域联防应变器材支援\n现场指挥官 | • 现场危害告知• 现场应变人员调度• 即时讯息回报监控\n抢救组 | • 事故现场人员搜救• 事故现场抢救与围堵• 危险物移除与遮断• 重要物资抢救• 支援人员抢救\n支援组 | • 支援事故现场应变器材• 协助抢救组人员著装• 架设除污帐篷协助除污\n管制组 | • 执行冷区区域管制• 人员/外部救援车辆管制及引导• 人员进出管制及记录• 环境浓度检测• 灾区事故看板设置\n急救组 | • 设立救护站• 负责伤患送医前医疗照顾、急救，并判定伤患是否须送医• 抢救组生理评估• 向外医疗单位联系\n通报组 | • 事故点通报\n[/TABLE]", "html": "<h4 class=\"vsub\">引言 — 序</h4><p>紧急应变中心(ERC)主要负责管理厂内的消防及紧急应变业务。ERC所建置的防灾整合系统能够连结厂务供应状态，并整合各类防灾警报讯息，作为灾变时的指挥中枢。</p><p>根据《消防法施行细则》第15条第一项自卫消防编组施行细则第五条规定，厂内需建立灭火班、通报班、避难引导班、安全防护班及救护班等自卫消防编组，这些编组任务由紧急应变中心(ERC)训练各组职掌，确保在灾害发生的第一时间能够有效启动救灾任务。</p><p>紧急应变中心(ERC)团队致力于撰写厂区应变紧急指引方针，并建立应变共通语言-灾害现场抢救标准作业程序 H.A.Z.M.A.T 以图文并茂方式，让同仁在平时及灾时能够迅速了解并遵循快速应变指引，确保各阶段的任务分配得以顺利进行，并让同仁了解不同灾害所需应变的技巧及注意事项。</p><h4 class=\"vsub\">1.1 紧急应变组织架构图</h4><table><tr><th>事故阶级</th><th>一阶事故</th><th>二阶事故</th><th>假日/非正常班值班</th></tr><tr><td>指挥官对象</td><td>事故部门 M2 主管</td><td>事故部门 M3 主管</td><td>ERC/ERT 值班代理</td></tr><tr><td>三阶事故</td><td>总指挥官（厂长）进驻，请求外部支援</td><td>安全幕僚：EHS/ME/CC team</td><td>监控中心：ERC/CCR</td></tr></table><p>组织架构阶层说明：</p><p>最高指挥层：总指挥官（厂长）→ 事故指挥官（事故部门主管），旁设「安全幕僚 (EHS/ME/CC team)」与「监控中心 (ERC/CCR)」。</p><p>平行功能分组：保全组、厂务组（空/水/气/电）、ERT现场指挥官 (ERC/ERT Team)、疏散组（下辖避难引导班、安全防护班）、计划组、公关组、财务组、后勤组。</p><p>ERT 现场指挥官下辖紧急应变组 (ERT team)：抢救组、支援组、管制组、急救组、通报组。</p><p>一、二阶事故由厂内应变；三阶事故或灾害扩大时启动「请求外部支援」。</p><h4 class=\"vsub\">1.2 各角色任务执掌</h4><table><tr><th>组织角色 / 编组</th><th>任务执掌明细</th></tr><tr><td>总指挥官(厂长)</td><td>• 进驻监控中心• 掌握异常事件• 确认应变目标</td></tr><tr><td>事故部门指挥官</td><td>• 评估及确认现场风险危害• 确认应变目标• 发展行动计划</td></tr><tr><td>安全幕僚(EHS/ME/CC team)</td><td>• 提供指挥官即时应变资讯及建议• 主管机关及外部支援单位通报• 联防支援器材的接收及清点</td></tr><tr><td>监控中心(ERC/CCR)</td><td>• 在意外事故紧急处理及控制过程中，负责接收/传递资讯• 依照简讯通报流程发送意外事故/虚惊事件简讯</td></tr><tr><td>保全组</td><td>• 外部支援单位/机关车辆引导• 外部救援单位车辆引导</td></tr><tr><td>厂务组(空/水/气/电)</td><td>• 通报EHS污染防治设备故障与修复状况• 通报EHS大量污染物排放状况及控制情形• 视灾区影响区域进行厂内通报</td></tr><tr><td>疏散组 - 避难引导班</td><td>• 引导人员进行逃生疏散• 人员清点与安全回报</td></tr><tr><td>疏散组 - 安全防护班</td><td>• 人员管制• 现场障碍物移除或通报• 关闭楼层防火门</td></tr><tr><td>计划组</td><td>• 研拟营运持续计划 (BCP注2)• 研拟灾后复原计划</td></tr><tr><td>公关组</td><td>• 对外发言及新闻稿发送</td></tr><tr><td>财务组</td><td>• 事故灾害财务损失计算• 编列灾害复原预算• 联系保险公司评估理赔事宜</td></tr><tr><td>后勤组</td><td>• 区域联防应变器材支援</td></tr><tr><td>现场指挥官</td><td>• 现场危害告知• 现场应变人员调度• 即时讯息回报监控</td></tr><tr><td>抢救组</td><td>• 事故现场人员搜救• 事故现场抢救与围堵• 危险物移除与遮断• 重要物资抢救• 支援人员抢救</td></tr><tr><td>支援组</td><td>• 支援事故现场应变器材• 协助抢救组人员著装• 架设除污帐篷协助除污</td></tr><tr><td>管制组</td><td>• 执行冷区区域管制• 人员/外部救援车辆管制及引导• 人员进出管制及记录• 环境浓度检测• 灾区事故看板设置</td></tr><tr><td>急救组</td><td>• 设立救护站• 负责伤患送医前医疗照顾、急救，并判定伤患是否须送医• 抢救组生理评估• 向外医疗单位联系</td></tr><tr><td>通报组</td><td>• 事故点通报</td></tr></table>"}, {"title": "灾害类型认知", "text": "Chapter 02 灾害类型认知\n2.1 火灾-灾害类型认知\n科技厂房内的火灾风险多样且复杂，这些火灾不仅可能造成重大财产损失，还可能对人员安全构成严重威胁。由于科技厂房通常涉及大量的电子设备、化学品和高精密机械设备，因此火灾的起因和类型也相对多样化。了解科技厂房内常见的火灾类型及其特征，有助于制定有效的防火措施和应变方案，从而减少火灾风险和损失。\n2.1.1 如遇机台火灾时，您需确认以下注意事项，再行灭火：\n火灾初期：1. 立即进行异常事件通报。2. 按下机台EMO(紧急停止按钮)。3. 拿取邻近机台灭火器进行灭火。（如灭火器取用2-3支无法灭火，应尽速离开）\n火灾中期：1. 事故机台断电，并确认机台化学品种类。（PS:禁水性物质禁止使用射水灭火）2. 抢救组射水前，确认是否已完成断电。3. 使用邻近灭火栓(箱)架设水线进行灭火，直至无火源情形。\n稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。\n2.1.2 如遇易燃性气体火灾时\n易燃性气体与空气混合，即使没有火源也会易燃起火，例如：PH3、SiH4、AsH3、H2、B2H6。\n火灾初期：1. 立即进行异常事件通报。2. 按下EMO(紧急停止按钮)。3. 拿取邻近灭火器进行灭火。\n火灾中期：1. 架设水线防护周围，并使用水雾捕捉悬浮微粒分子。2. 使用热像仪进行事故点温度确认直至钢瓶残气自燃为止。\n稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。\n2.1.3 如遇瓦斯减压站火灾时，您需确认以下注意事项，再行灭火：\n火灾初期：1. 立即进行异常事件通报。2. 按下EMO(紧急停止按钮)。3. 架设水线防护周围，并使用水雾捕捉。\n火灾中期：1. 使用热像仪进行事故点温度监测。2. 持续水雾防护。\n稳定阶段：1. 使用热像仪进行事故点确认无复燃、无泄漏情形。2. 封锁事故现场。\n2.1.4 如遇油类车火灾时，您需确认以下注意事项，再行灭火：\n火灾初期：1. 立即进行异常事件通报。2. 按下邻近消防报警器、开启该区消防泡沫手阀。3. 拿取邻近车辆灭火器进行灭火。4. 移除车辆附近可燃物质。\n火灾中期：1. 取用邻近消防栓(箱)进行射水，直至车辆无燃烧情形。2. 使用热像仪进行事故点温度确认。\n稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统(室内)。3. 封锁事故现场。\n2.1.5 如遇电动车火灾时，您需确认以下注意事项，再行灭火：\n火灾初期：1. 现场评估环境、车体、人员安全通报。2. 车辆识别判断车辆品牌及纯电车或混合动力车。3. 进行充电桩电源关闭动作。4. 使用车用灭火毯覆盖及砲塔、底部洒水器水雾防护。5. 开启区域消防排烟系统。\n火灾中期：1. 使用热像仪进行事故点温度确认。\n稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。\n2.1.6 如遇太阳能板火灾时，您需确认以下注意事项，再行灭火：\n火灾初期：1. 进行太阳能板及台电端变电站关闭动作。2. 使用热像仪进行事故点温度确认。3. 使用邻近干粉灭火器进行灭火。\n火灾中期：1. 架设水线，距离需保持6公尺以上，以10公尺为最佳距离，并以射水角度30度水雾射水，瞄子出水压力至少 7 kgf/cm² (100 psi)。2. 使用热像仪进行事故点温度确认。\n稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。\n※事件灾害层级改变，处置作为会有所调整，内容仅供参考。\n2.2 化灾-灾害类型认知\n化学灾害是指由于化学物质的泄漏、爆炸、燃烧或其他意外事件，导致环境污染、财产损失或人员伤亡。这些灾害可能发生在化学品的生产、储存、运输和使用过程中。\n2.2.1 如遇遭受化学品喷溅时，您需确认以下注意事项：\n化学品喷溅初期：1. 立即进行异常事件通报，说明喷溅化学品种类及喷溅部位。2. 脱(剪)除衣物，并至邻近冲身洗眼器冲淋15分钟，使用中和剂进行中和。（六腐灵：适用HF或酸性介质氟类衍生物；敌腐灵：适用TMAH或酸碱类化学品）\n化学品喷溅中期：1. 人员至保健中心进行生理评估。2. 环境清洁处理。\n稳定阶段：1. 保健中心确认受伤人员是否就医。2. 封锁事故现场。\n2.2.2 如遇化学品泄漏时，您需确认以下注意事项：\n化学品泄漏初期：1. 立即进行异常事件通报，确认有无人员受伤。2. 现场判断化学物质，使用pH试纸测得酸碱性。3. 穿著PPE注4，关闭源头，取吸酸棉片(条)进行环境围堵及封锁。（由外向内进行围堵）\n化学品泄漏中期：1. 使用应变器材，进行事故点止漏作业。2. 进行环境清洁，最终环境应为中性(pH=7)。（酸性物质：使用小苏打，碱性物质：柠檬酸，进行中和反应）\n稳定阶段：1. 确认环境复归后，抢救组人员进行除污作业。2. 将有害废弃物物品丢置有害废弃物仓库。（应于外部标记事件等废弃物物品名称）\n2.2.3 如遇气体泄漏时，您需确认以下注意事项：\n气体泄漏初期：1. 立即进行异常事件通报，确认有无人员受伤。2. 进行危害辨识(气体颜色、味道、标示)。3. 抢救组人员、穿著PPE并使用侦检器材进行环境侦检作业。\n气体泄漏中期：1. 抢救组人员，进行源头遮断及止漏作业。2. 事故点及环境点因全程进行侦检作业，以确保抢救组人员安全。\n稳定阶段：1. 抢救组人员进行环境侦检，确认事故点及环境无读值。2. 确认事件结束后，抢救组人员进行除污作业。3. 封锁事故现场。\n2.2.4 如遇化学品复合式灾害时，您需确认以下注意事项：\n化学品复合式灾害初期：1. 立即进行异常事件通报，确认有无人员受伤。2. 进行危害辨识(气体颜色、味道等)。3. 抢救组人员穿著PPE并使用侦检器材进行环境侦检作业及移除。\n化学品复合式灾害中期：1. 抢救组人员，进行源头遮断及防护。2. 事故点及环境点因全程进行侦检作业，以确保抢救组人员安全。\n稳定阶段：1. 抢救组人员进行环境侦检，确认事故点及环境无复燃、无读值。2. 确认事件结束后，抢救组人员进行除污作业。3. 封锁事故现场。\n※事件灾害层级改变，处置作为会有所调整，内容仅供参考。", "html": "<h4 class=\"vsub\">2.1 火灾-灾害类型认知</h4><p>科技厂房内的火灾风险多样且复杂，这些火灾不仅可能造成重大财产损失，还可能对人员安全构成严重威胁。由于科技厂房通常涉及大量的电子设备、化学品和高精密机械设备，因此火灾的起因和类型也相对多样化。了解科技厂房内常见的火灾类型及其特征，有助于制定有效的防火措施和应变方案，从而减少火灾风险和损失。</p><h4 class=\"vsub\">2.1.1 如遇机台火灾时，您需确认以下注意事项，再行灭火：</h4><p>火灾初期：1. 立即进行异常事件通报。2. 按下机台EMO(紧急停止按钮)。3. 拿取邻近机台灭火器进行灭火。（如灭火器取用2-3支无法灭火，应尽速离开）</p><p>火灾中期：1. 事故机台断电，并确认机台化学品种类。（PS:禁水性物质禁止使用射水灭火）2. 抢救组射水前，确认是否已完成断电。3. 使用邻近灭火栓(箱)架设水线进行灭火，直至无火源情形。</p><p>稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。</p><h4 class=\"vsub\">2.1.2 如遇易燃性气体火灾时</h4><p>易燃性气体与空气混合，即使没有火源也会易燃起火，例如：PH3、SiH4、AsH3、H2、B2H6。</p><p>火灾初期：1. 立即进行异常事件通报。2. 按下EMO(紧急停止按钮)。3. 拿取邻近灭火器进行灭火。</p><p>火灾中期：1. 架设水线防护周围，并使用水雾捕捉悬浮微粒分子。2. 使用热像仪进行事故点温度确认直至钢瓶残气自燃为止。</p><p>稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。</p><h4 class=\"vsub\">2.1.3 如遇瓦斯减压站火灾时，您需确认以下注意事项，再行灭火：</h4><p>火灾初期：1. 立即进行异常事件通报。2. 按下EMO(紧急停止按钮)。3. 架设水线防护周围，并使用水雾捕捉。</p><p>火灾中期：1. 使用热像仪进行事故点温度监测。2. 持续水雾防护。</p><p>稳定阶段：1. 使用热像仪进行事故点确认无复燃、无泄漏情形。2. 封锁事故现场。</p><h4 class=\"vsub\">2.1.4 如遇油类车火灾时，您需确认以下注意事项，再行灭火：</h4><p>火灾初期：1. 立即进行异常事件通报。2. 按下邻近消防报警器、开启该区消防泡沫手阀。3. 拿取邻近车辆灭火器进行灭火。4. 移除车辆附近可燃物质。</p><p>火灾中期：1. 取用邻近消防栓(箱)进行射水，直至车辆无燃烧情形。2. 使用热像仪进行事故点温度确认。</p><p>稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统(室内)。3. 封锁事故现场。</p><h4 class=\"vsub\">2.1.5 如遇电动车火灾时，您需确认以下注意事项，再行灭火：</h4><p>火灾初期：1. 现场评估环境、车体、人员安全通报。2. 车辆识别判断车辆品牌及纯电车或混合动力车。3. 进行充电桩电源关闭动作。4. 使用车用灭火毯覆盖及砲塔、底部洒水器水雾防护。5. 开启区域消防排烟系统。</p><p>火灾中期：1. 使用热像仪进行事故点温度确认。</p><p>稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。</p><h4 class=\"vsub\">2.1.6 如遇太阳能板火灾时，您需确认以下注意事项，再行灭火：</h4><p>火灾初期：1. 进行太阳能板及台电端变电站关闭动作。2. 使用热像仪进行事故点温度确认。3. 使用邻近干粉灭火器进行灭火。</p><p>火灾中期：1. 架设水线，距离需保持6公尺以上，以10公尺为最佳距离，并以射水角度30度水雾射水，瞄子出水压力至少 7 kgf/cm² (100 psi)。2. 使用热像仪进行事故点温度确认。</p><p>稳定阶段：1. 使用热像仪进行事故点确认无复燃情形。2. 关闭该区域ACV闸阀系统。3. 封锁事故现场。</p><p>※事件灾害层级改变，处置作为会有所调整，内容仅供参考。</p><h4 class=\"vsub\">2.2 化灾-灾害类型认知</h4><p>化学灾害是指由于化学物质的泄漏、爆炸、燃烧或其他意外事件，导致环境污染、财产损失或人员伤亡。这些灾害可能发生在化学品的生产、储存、运输和使用过程中。</p><h4 class=\"vsub\">2.2.1 如遇遭受化学品喷溅时，您需确认以下注意事项：</h4><p>化学品喷溅初期：1. 立即进行异常事件通报，说明喷溅化学品种类及喷溅部位。2. 脱(剪)除衣物，并至邻近冲身洗眼器冲淋15分钟，使用中和剂进行中和。（六腐灵：适用HF或酸性介质氟类衍生物；敌腐灵：适用TMAH或酸碱类化学品）</p><p>化学品喷溅中期：1. 人员至保健中心进行生理评估。2. 环境清洁处理。</p><p>稳定阶段：1. 保健中心确认受伤人员是否就医。2. 封锁事故现场。</p><h4 class=\"vsub\">2.2.2 如遇化学品泄漏时，您需确认以下注意事项：</h4><p>化学品泄漏初期：1. 立即进行异常事件通报，确认有无人员受伤。2. 现场判断化学物质，使用pH试纸测得酸碱性。3. 穿著PPE注4，关闭源头，取吸酸棉片(条)进行环境围堵及封锁。（由外向内进行围堵）</p><p>化学品泄漏中期：1. 使用应变器材，进行事故点止漏作业。2. 进行环境清洁，最终环境应为中性(pH=7)。（酸性物质：使用小苏打，碱性物质：柠檬酸，进行中和反应）</p><p>稳定阶段：1. 确认环境复归后，抢救组人员进行除污作业。2. 将有害废弃物物品丢置有害废弃物仓库。（应于外部标记事件等废弃物物品名称）</p><h4 class=\"vsub\">2.2.3 如遇气体泄漏时，您需确认以下注意事项：</h4><p>气体泄漏初期：1. 立即进行异常事件通报，确认有无人员受伤。2. 进行危害辨识(气体颜色、味道、标示)。3. 抢救组人员、穿著PPE并使用侦检器材进行环境侦检作业。</p><p>气体泄漏中期：1. 抢救组人员，进行源头遮断及止漏作业。2. 事故点及环境点因全程进行侦检作业，以确保抢救组人员安全。</p><p>稳定阶段：1. 抢救组人员进行环境侦检，确认事故点及环境无读值。2. 确认事件结束后，抢救组人员进行除污作业。3. 封锁事故现场。</p><h4 class=\"vsub\">2.2.4 如遇化学品复合式灾害时，您需确认以下注意事项：</h4><p>化学品复合式灾害初期：1. 立即进行异常事件通报，确认有无人员受伤。2. 进行危害辨识(气体颜色、味道等)。3. 抢救组人员穿著PPE并使用侦检器材进行环境侦检作业及移除。</p><p>化学品复合式灾害中期：1. 抢救组人员，进行源头遮断及防护。2. 事故点及环境点因全程进行侦检作业，以确保抢救组人员安全。</p><p>稳定阶段：1. 抢救组人员进行环境侦检，确认事故点及环境无复燃、无读值。2. 确认事件结束后，抢救组人员进行除污作业。3. 封锁事故现场。</p><p>※事件灾害层级改变，处置作为会有所调整，内容仅供参考。</p>"}, {"title": "通报及处置阶段", "text": "Chapter 03 异常事件通报及处置阶段\n3.1 事件触发及通报要领\n透过防灾监视系统，能主动式预防侦测，并于第一时间掌握异常点：\n风险控制管理系统：火警系统、防灾整合系统、监视系统、极早期侦烟系统、紧急应变系统。\n厂务工程管理系统：FMCS厂务监控系统、气体侦测系统、废水处理系统、VESDA侦测系统、漏液处理系统、空调系统。\n人员于厂区，于第一时间发现不安全情况，都可以透过电话进行通报。通报要领「人、事、时、地、物」：\n\n[TABLE 4 | 6 rows]\n通报要素 | 回报内容明细\n人 (人员) | 姓名、部门、连络电话\n事 (事件) | 不安全情况\n时 (时间) | 发生时间\n地 (地点) | 发生位置（厂区、栋别、柱位、机台）\n物 (事物) | 事件影响范围、是否有人员受伤\n[/TABLE]\n\nTW 厂区紧急通报专线 (Emergency Notification Hotline)\n\n[TABLE 5 | 3 rows]\n通报单位 | Teams 拨打 | 公司手机 | 市话外线 (External Line) | # 指定厂区代码 (# site code)\nERC / CCR(紧急应变中心) | 2119 | 75-2119 | 04-2576-2119 | F11: #1 | F16/O3/W5: #2 | MTB/AATT/O4: #3 | MMTN: #4 | MTT: #5\nHealth Center(保健中心) | 5119 | 75-5119 | 04-2576-5119 | F11: #1 | F16/A3: #2 | MTB: #3 | AATT: #5 | MMTN: #6 | O3/W5: #7 | O4: #8\n[/TABLE]\n\nLive Safe+ TW-EHS：「只要我看到，我就负有责任 (If I see it, I own it)」。厂区避难集结点位置请参考：Alias: TWERT /\n3.2 异常事件处置阶段说明\n处置流程：事件发生（系统触发 / 人员通报）→ 初期处置阶段（事件确认 / 0阶事故）→ 若未控制且人员疏散 → 厂内 ERT 应变阶段（1阶事故 → 灾害扩大 → 2阶事故）→ 若灾害失控 → 外部支援（3阶事故）→ 事件已控制 → 稳定阶段（稳定复归）。\n初期处置阶段：\n任何的事故皆由小灾害开始，未及时处理将随著时间演变成大灾害，如果能在灾害初期(0阶事故)，快速抑制灾情，并能减少灾害扩大。\n来源确认：确认异常事件来源及位置。\n危害性确认：对于各类异常事件需现场立即判断危害来源，包含环境侦检、酸碱性测试、化学品种类判断等。\n影响范围确认：确认异常事件影响范围，如有波及可能应尽速移除物品。\n控制处置：遮断危害源源头，并进行现场异常处理。\nERT 处置阶段：\n当0阶事故无法有效控制时，厂内便会启动ERT应变，并依据事故变化，滚动式调整事故阶级：\n0阶事故：异常事件不需启动ERT，由部门值班人员即可处理。\n1阶事故：小灾害，单一部门ERT足以处理。\n2阶事故：重大灾害，需其他部门ERT支援。\n3阶事故：严重灾害，请求外界支援。", "html": "<h4 class=\"vsub\">3.1 事件触发及通报要领</h4><p>透过防灾监视系统，能主动式预防侦测，并于第一时间掌握异常点：</p><p>风险控制管理系统：火警系统、防灾整合系统、监视系统、极早期侦烟系统、紧急应变系统。</p><p>厂务工程管理系统：FMCS厂务监控系统、气体侦测系统、废水处理系统、VESDA侦测系统、漏液处理系统、空调系统。</p><p>人员于厂区，于第一时间发现不安全情况，都可以透过电话进行通报。通报要领「人、事、时、地、物」：</p><table><tr><th>通报要素</th><th>回报内容明细</th></tr><tr><td>人 (人员)</td><td>姓名、部门、连络电话</td></tr><tr><td>事 (事件)</td><td>不安全情况</td></tr><tr><td>时 (时间)</td><td>发生时间</td></tr><tr><td>地 (地点)</td><td>发生位置（厂区、栋别、柱位、机台）</td></tr><tr><td>物 (事物)</td><td>事件影响范围、是否有人员受伤</td></tr></table><p>TW 厂区紧急通报专线 (Emergency Notification Hotline)</p><table><tr><th>通报单位</th><th>Teams 拨打</th><th>公司手机</th><th>市话外线 (External Line)</th><th># 指定厂区代码 (# site code)</th></tr><tr><td>ERC / CCR(紧急应变中心)</td><td>2119</td><td>75-2119</td><td>04-2576-2119</td><td>F11: #1</td><td>F16/O3/W5: #2</td><td>MTB/AATT/O4: #3</td><td>MMTN: #4</td><td>MTT: #5</td></tr><tr><td>Health Center(保健中心)</td><td>5119</td><td>75-5119</td><td>04-2576-5119</td><td>F11: #1</td><td>F16/A3: #2</td><td>MTB: #3</td><td>AATT: #5</td><td>MMTN: #6</td><td>O3/W5: #7</td><td>O4: #8</td></tr></table><p>Live Safe+ TW-EHS：「只要我看到，我就负有责任 (If I see it, I own it)」。厂区避难集结点位置请参考：Alias: TWERT /</p><h4 class=\"vsub\">3.2 异常事件处置阶段说明</h4><p>处置流程：事件发生（系统触发 / 人员通报）→ 初期处置阶段（事件确认 / 0阶事故）→ 若未控制且人员疏散 → 厂内 ERT 应变阶段（1阶事故 → 灾害扩大 → 2阶事故）→ 若灾害失控 → 外部支援（3阶事故）→ 事件已控制 → 稳定阶段（稳定复归）。</p><p>初期处置阶段：</p><p>任何的事故皆由小灾害开始，未及时处理将随著时间演变成大灾害，如果能在灾害初期(0阶事故)，快速抑制灾情，并能减少灾害扩大。</p><p>来源确认：确认异常事件来源及位置。</p><p>危害性确认：对于各类异常事件需现场立即判断危害来源，包含环境侦检、酸碱性测试、化学品种类判断等。</p><p>影响范围确认：确认异常事件影响范围，如有波及可能应尽速移除物品。</p><p>控制处置：遮断危害源源头，并进行现场异常处理。</p><p>ERT 处置阶段：</p><p>当0阶事故无法有效控制时，厂内便会启动ERT应变，并依据事故变化，滚动式调整事故阶级：</p><p>0阶事故：异常事件不需启动ERT，由部门值班人员即可处理。</p><p>1阶事故：小灾害，单一部门ERT足以处理。</p><p>2阶事故：重大灾害，需其他部门ERT支援。</p><p>3阶事故：严重灾害，请求外界支援。</p>"}, {"title": "H.A.Z.M.A.T 抢救程序", "text": "Chapter 04 灾害现场抢救标准作业程序 H.A.Z.M.A.T.\n灾害现场抢救标准作业程序(H.A.Z.M.A.T.)，起源于20世纪，当时全球工业化快速发展，事故发生时无专业应变处理小组处理，故许多国家建立应变处理小组，而H.A.Z.M.A.T.目前为美国消防(NFPA 注8)、台湾消防(NFA)及多数高科技厂广泛使用的灾害应变战术手法之一，透过指挥战术加以吓阻灾害扩延。\n4.1 Hazard identification - 危害辨识\n掌握灾害现场危害风险等资讯并快速回报：火灾类型(A.B.C.D类)、化学品性质与反应性(依SDS注10)、储存数量及位置、受伤人数、复合式灾害。取得危害辨识资料可透过化学品 SDS、ERG注11、化学品应变对策系统获取资讯。\n安全资料表 (SDS) 十六项揭露资讯（应变时以重点项次作为参考）：\n\n[TABLE 6 | 5 rows]\n项次 1–4 | 项次 5–8 | 项次 9–12 | 项次 13–16\n1. 化学品与厂商资料 | 5. 灭火措施（紧急应变） | 9. 物理及化学性质（预防措施） | 13. 废弃物处置方法\n2. 危害辨识资料（危害辨识） | 6. 泄漏处理方法（紧急应变） | 10. 安定性与反应性（预防措施） | 14. 运送资料\n3. 成分辨识资料 | 7. 安全处置与储存方法 | 11. 毒性资料 | 15. 法规资料\n4. 急救措施（紧急应变） | 8. 暴露预防措施（预防措施） | 12. 生态资料 | 16. 其他资料\n[/TABLE]\n\n紧急应变指南 (ERG) 页面介绍\n黄色：联合国编号 (UN No.)；蓝色：英文名称；紫色：中文名称。\n当黄色、蓝色或紫色框页化学品以底色标记时，表示该化学品为吸入性毒性危害(TIH)物质（如氯气及氨气等）。\n处理原则编号备注「P」者，表示此物质受热或受污染时，会产生剧烈的聚合反应。\n查到处理原则后，便能查到：潜在危害（健康危害、火灾或爆炸）、公共安全（相关资讯、防护衣、疏散）、紧急应变（火灾、泄漏，以及最初医疗急救之行动建议方案）。\n绿色页面：初期隔离和防护行动距离表、危险的禁水性物质（提供初期隔离距离与保护行动距离两种不同类型安全距离建议；保护行动距离分为大小量及日夜间等泄漏情境）、常见的六种吸入性毒性危害物质。\n大量泄漏：大于208公升(55加仑)；小量泄漏：小于或等于208公升(55加仑)。\n化学品应变对策 App (HCARD) 操作说明\n化学品应变App，收集厂内250种化学品种类，汇集化学品SDS及ERG紧急应变指南资讯，透过iPad扫描条码或者手机触碰NFC位置，即可随手可得应变对策，且张贴于厂内高风险区域，让同仁于第一时间能快速应变。\niPad 扫描 QR Code：Step 1 点选 iPad QR Code → Step 2 扫描化学品应变对策上 QR Code → Step 3 输入 email、password → Step 4 开启 Power apps 应用程式 → Step 5 输入关键字搜寻。\n手机触碰 NFC：Step 1 手机触碰 NFC 贴纸（需紧贴触碰）→ Step 2 开启 Power apps 应用程式 → Step 3 输入关键字搜寻。\n系统查询功能：介面功能：① 关键字输入 → ② 关键字相关化学品搜寻浏览 → ③ 检视厂内化学品成分、特征、危害、物化特性、衍生物及不相容物 → ④ 检视应变处理方法及注意事项（火灾处理/泄漏处理/急救方法）→ ⑤ 开启「检视处理原则」可查看该物质 ERG 处理原则与 PPE 建议。\n4.2 Action plan - 行动方案\n行动方案流程：拟定救灾计划 → ERT集结 → 紧急应变器材 → 区域管制划分 → 应变处置。\n救灾计划包含：1. 危害认知；2. ERT成员（监控指挥官、现场指挥官、抢救组、管制组、支援组、救护组）；3. 应变作为（进攻型应变、防守型应变）；4. 区域管制范围（冷、暖、热区封锁线划分）；5. 除污站架设位置；6. 人员是否疏散。\nERT集结：由 ERC/CCR注12 使用口语广播，通知事故部门ERT进行集结，并由现场指挥官下达组织任务（抢救组、管制组、支援组、急救组）。\n各类防护衣级别分类说明\n\n[TABLE 7 | 8 rows]\n分类项目 | Level A | Level B | Level C | 消防衣\n美规分类 | Level A | Level B | Level C | NFPA / EN469\n欧规分类 | Type 1 (液态或气态) | Type 2 (非气密式)Type 3 (液密式) | Type 4 (防喷沫式)Type 5 (防微粒式) | EN469:2020EN 465\n穿戴时机 | 环境为密闭空间且有未知危害，需要最高级别的皮肤、眼睛与呼吸防护设备 | 环境中含氧量低于19.5%，需要最高级别的呼吸防护，但可以接受较低等级的皮肤防护设备 | 已识别危害来源，且确认不会被皮肤吸收或造成皮肤伤害 | 环境有爆炸或燃烧的疑虑\n环境皮肤接触风险 | 剧毒化学固体或液体或气体，气体经皮肤产生 IDLH | 剧毒化学固体或液体或气体，气体经皮肤不产生 IDLH | 有害化学固体或液体或气体 | 火灾\n对应皮肤 PPE | 气密式防护衣 | 连身防护衣(含头罩) | 连身或两件式防护衣(含头罩) | 消防衣\n环境吸入风险 | 缺氧 | 有害的气体或粉尘高于 PEL 值 | 有害的气体或粉尘低于 PEL 值 | 缺氧\n对应呼吸 PPE | 送气呼吸系统 | 送气或过滤呼吸系统 | 送气或过滤呼吸系统 | 送气呼吸系统\n[/TABLE]\n\n各级防护衣与消防衣穿戴配备及注意事项\nA级防护衣：穿戴时机：适用所有浓度未知情况下，物质浓度侦测超过立即危害浓度(IDLH)，可发挥呼吸、皮肤与眼睛最高程度防护。穿戴配备：A级防护衣、A级防护靴、SCBA注13、呼吸面罩、无线电。适用时机：① 气体泄漏处置 ② 化学品泄漏处置 ③ 未知气体处置 ④ 环境侦检。重点：若泄漏之气体有爆炸或燃烧的疑虑，则不可穿著A级防护衣。注意事项：  • 视觉屏蔽：仅有前视野镜面，左右视野遭遮蔽，视野受限。  • SCBA漏气：著装时确认气瓶是否漏气，避免防护衣膨胀。  • SCBA耗氧量：当气瓶压力低于 1/4 (1000 psi) 时，应立即退出事故点。  • 通讯设备异常：至事故现场需进行无线电通联测试，异常时进行无线电端子对接重接。  • 镜面起雾：使用双手或拔除肺力阀进行除雾动作。  • A级防护衣膨胀：SCBA或面罩漏气造成充气膨胀时，立即双手抱腹部内压排出空气，并进行漏气排除。\nB级防护衣：穿戴时机：适用事故物质不会对皮肤造成严重伤害，但会对眼睛及呼吸系统造成严重伤害，亦用于缺氧环境。穿戴配备：C级防护衣、C级防护靴、SCBA、呼吸面罩、抗化手套、安全帽、无线电。适用时机：① 气体泄漏处置 ② 化学品泄漏处置 ③ 环境侦检 ④ 缺氧环境。重点：若泄漏之气体有爆炸或燃烧的疑虑，则不可穿著B级防护衣。\nC级防护衣：穿戴时机：适用空气中有害物气体浓度经侦检低于立即危害浓度时、无直接接触有害物质液体或粉尘及人员除污时。穿戴配备：C级防护衣、C级防护靴、滤毒罐、猪鼻子、护目镜、耐酸碱手套、安全帽。适用时机：① 低浓度灾害处置 ② 环境侦检 ③ 环境复归 ④ 人员除污。重点：若泄漏之气体有爆炸或燃烧的疑虑，则不可穿著C级防护衣。\n消防衣：穿戴时机：适用于高温及有火源之事故现场。穿戴配备：消防衣裤、防焰头套、消防靴、SCBA、呼吸面罩、无线电、消防帽。适用时机：① 各类火灾处置 ② 高温场所异常处置 ③ 易燃性气体异常处置 ④ 环境侦检。重点：若有毒泄漏之气体疑虑，则不可穿著消防衣（同时注意SCBA漏气与通讯设备检查）。\nC级防护衣滤毒罐差异性 (NIOSH 注14 颜色编码系统)\n\n[TABLE 8 | 5 rows]\n颜色标签 | 范例型号 | 适用危害物质\n黑色 | 3M 6001 | 由溶剂产生的有机蒸气（例如：油漆及稀释剂所释出的有机蒸气）\n白色 | 3M 6002 | 氯气、硫化氢、与二氧化硫等酸性气体\n黄色 | 3M 6003 | 有机蒸气与氯气、盐酸、二氧化硫、氢氟酸及其他酸性气体\n绿色 | 3M 6004 | 适用于滤除氨或甲胺(methylamine)等碱性有害物质\n[/TABLE]\n\n滤毒罐破出：滤毒罐在应变过程中，当您吸入异味时，代表滤毒罐内纤维层及活性碳层已饱和，且有破出现象（饱和度 30% → 60% → 破出），必须进行滤毒罐更换确保自身安全。公式：滤毒罐防护时间 = 标准检测浓度 × 实际防护时间 / 现场检测浓度。\n紧急应变器材设置说明与各厂区紧急应变柜点位\n法源依据：一、职安法第37条（事业单位工作场所发生职业灾害，雇主应即采取必要之急救、抢救等措施）；二、Global ERT Standard。设置原则：1. 化学品危害；2. 电器/火灾类危害；3. 集结点考量；4. 无尘室入口为必要设置点位；5. 参考公共危险物品及可燃性高压气体设置区，相邻 200M 可支援器材点位。\n\n[TABLE 9 | 6 rows]\n厂区 | 数量统计 | 详细点位分布\nF11 (MTTW) | 共10组点位(A级5柜、B级2柜、C级59~64柜、消防衣3组) | • 5F：FAB-C、CUB-1B、S/B(FAB-B, FAB-C)• 4F：FAB-A、CUB-1B、CUB-1、CUB-2• 3F：FAB-B、FAB-A、FAB-C、CUB-1A• 2F：FAB-A、FAB-B、FAB-C、CUB-2• 1F：FAB-A、FAB-B、FAB-C、CUB-1B\nFAB16 / F16 (MMT) | 紧急应变柜 28组简易型应变柜 3组(设有灯号提醒) | • Office：OB 4-1、OB 4-2 (定点)• A1 FAB：5F C/R(简易)、2F A1 FAB 2-1(定点)、1F A1 FAB 1-1 / 1-2、1F A1 HPM 1-1、LB1 A1 FAB B1-1• A2 SUP/FAB：5F A2 FAB 5-1、2F A2 FAB 2-1、1F A2 HPM 1-1、LB1 A2 FAB B1-1、5F C/R(简易)、2F C/R(简易)• A3 Phase 1/2：5F A3 HPM 5-1 / A3 FAB 5-1、4F A3 HPM 4-1、3F A3 FAB 3-1/3-2 / A3 HPM 3-1、2F A3 HPM 2-1、1F A3 HPM 1-1 / 1-2、B1F A3 HPM B1-1• 周边栋别：CUB (A1&A2 CUB2-1, CUB2-2)、WH (A1&A2 WH 1-1)、Dormitory (宿舍1-1)、A3 CUP (A3 CUB 3-1, CUB 2-1)、W/H (A3 W/H 1-1)\nMTB | 紧急应变柜 6组(设有灯号提醒) | • FAB 3F：FAB-1、FAB-2 (3F定点)• SB 1F：SB-1、SB-2 (厂务监控室旁)• CUP：2F CUP-2、1F CUP-1\nTCP | 紧急应变柜 4组(设有灯号提醒) | • Office 1F (Lobby大厅)：OB-1、OB-2• CUP 2F：CUP-1、CUP-2\nAATT | 紧急应变柜 5组 | • Office-2：2F Security check point• FAB：5F C/R入口处、3F C/R入口处• CUB：5F 2号梯旁\n[/TABLE]\n\n4.3 Zone - 区域管制与环境侦检\n火灾管制区域划分：楼层划分：以火灾事故点以上楼层为管制区域（Ex: 当4F火灾发生时，管制区域为整栋别，禁止人员进入，由管制组人员使用封锁线于1F出入口进行管制）。栋别划分：火势过大，造成栋别灾害扩大时，则进行该栋别出入口封锁管制（1F各出入口禁止人员进入）。\n\n[TABLE 10 | 4 rows]\n区域名称 | 标示颜色 | 区域定义与装备规定\n热区 (Hot Zone) | 红色 | 又称污染区或禁区，为事故地点周围可能遭受污染区域，化学品浓度可能超过 TWA/STEL/IDLH 造成人员死亡或严重影响健康风险，使用红色热区封锁线。须著消防衣或 A级防护衣。\n暖区 (Warm Zone) | 黄色 | 又称影响区或除污区，为热区与冷区间缓冲区域，化学品浓度低于 TWA/STEL/IDLH 但高于一般背景值，功用为除污区域，使用黄色暖区封锁线。须著 C级防护衣，设除污走道。\n冷区 (Cold Zone) | 蓝色(绿色封锁线) | 又称安全区或支援区，为未受污染或已除污区域，使用绿色冷区封锁线。注意事项：1. 指挥站应设于冷区及上风位置；民众、记者则在冷区之外。2. 管制组对于出入管制区之抢救人员应记录管制，禁止未著适当防护装备人员出入。\n[/TABLE]\n\n首次接近事故现场侦检要领：1. 应变人员安全为第一优先；2. 穿著适当防护衣(PPE)；3. 考量事故点风向，并由上风处靠近事故点，由外至内进行侦检，以降低污染风险；4. 采二进/二出双人小组系统；5. 并依侦检数据划设热、暖、冷区。\n未知化学品连续监测顺序：1. 缺氧/富氧：量测氧气浓度（例：O2 侦测范围 0~25.0%，Alarm1: 19.5 vol%，Alarm2: 18.0 vol%）；2. 易燃性：量测爆炸下限(LEL)；3. 腐蚀性：量测pH值；4. 毒性：量测有毒物质种类及浓度；5. 事故地点：密闭或开放空间；6. 化学品蒸气密度：比空气重或轻。\n侦检三阶段：初期（辨识化学品种类及危害、评估健康危害、选用防护具、决定控制区域、制定员工保护措施）→ 中期（判断泄漏来源、环境浓度、评估作业安全性、确认控制有效性）→ 后期（危害暴露纪录、评估现场是否已无潜在危害、确认环境浓度已无读值）。\n爆炸界限与化学品危害暴露指标：UEL 爆炸上限：可燃性气体、蒸气或粉体与空气混合形成可燃性混合物接触火源，能被引燃或引爆之最高浓度。LEL 爆炸下限：能被引燃或引爆之最低浓度。（参考 SDS 第九项物理及化学特性）PEL 容许浓度：中央主管机关所订定作业环境中有害物质容许暴露标准。PEL-TWA（八小时日时量平均容许浓度）：劳工每天工作八小时，一般劳工重复暴露此浓度下，不致有不良反应。PEL-STEL（短时间时量平均容许浓度）：劳工连续暴露在此浓度任何十五分钟，不致有不可忍受之刺激、慢性或不可逆组织病变、麻醉昏晕作用。IDLH：生命、健康立即危险性，暴露为30分钟内不引起不可恢复健康效应之最大浓度。（参考 SDS 第八项暴露预防措施）\n4.4 Managing - 应变组织\n成立灾害应变组织，并各司其职，各组别指派一名小组长，带领组员细分应变任务并回报：\n指挥官：现场指挥官进行现场危害告知，并分配组别进行抢救任务，随时掌握各组行动并回报监控指挥官直至任务结束。\n抢救组：负责灾害异常处理，含人员搜救等任务，并以通讯设备回报现场指挥官目前抢救任务阶段，直至灾害结束。\n管制组：负责区域管制，执行冷区区域管制及封锁，禁止非相关人员进入至事故现场，严加控管人员出入情形，引导外部支援车辆入厂等。\n支援组：负责提供各种支援，包括应变器材物资供应，确保应变小组在任何情况下都能获得所需的资源和支援。\n急救组：1. 负责伤患救治医疗评估，并依伤患情况判定是否须就医；2. 抢救组、除污人员应于任务结束后，至救护站进行生理评估。\n4.5 Assistance - 外界支援\n灾害超出厂内应变能力时，指挥官决策请求政府/友厂机构援助，并进行事故应变转移。联防组织包含：政府机关/消防队、友厂支援、学者与专家（环境事故专业技术小组）、地区医院。\n指挥权转移：当外部单位成立指挥中心后，指挥权由外部单位权责指挥（EX：火灾-消防局、化灾-环保局）；事故应变转移时，须第一时间通知中部科学园区管理局；公司人员调度仍由区域紧急应变小组指挥官（事故发生部门M3主管或以上职等）负责。\n\n[TABLE 11 | 4 rows]\n厂区 | 外部支援单位及联络电话\nMTTW | • 坪顶消防队：03-3280309• 桃园市政府警察局龟山分局大华派出所：03-3975557• 桃园市政府：03-3322101• 桃园市政府环境保护局：03-3386021• 华亚科技园区服务中心：03-3970000• 北区职业安全卫生中心：02-89956700• 林口长庚纪念医院：03-3281200\nF16 / MTB | • 后里消防队：25562600• 大甲分局后里分驻所：25562037 | 义里派出所：25562333• 内政部警政署保安警察第二总队：25584750• 台中市政府：22289111 | 台中市政府环保局：22289111、22276011• 中部科学园区管理局：25658588• 中区职业安全卫生中心：22550633（毒灾联防小组依 ENVIRONMENTAL PROTECTION SECTION 提供之友厂通讯录）• 邻里长：后里里 杨春明 25573325 | 厚里里 黄金益 25586747 | 公馆里 冯咏淮 25560459 | 广福里 郭明洲 25566205• 医疗单位：中国医药大学附设医院丰原分院 25222538#119 | 中国医药大学附设医院 22052121 | 卫福部丰原医院 25271180#2198 | 台中荣总 23592525#3611\nMTTN | • 台南市消防局：06-2975119 | 土城消防分队(救护车)：06-2575276• 台南市政府警察局第三分局：06-2567666 / 2567005• 台南市政府：06-2991111 | 台南市政府环境保护局：06-2686751• 台南科工区服务中心：06-3840234~5• 南区职业安全卫生中心：07-2354861• 医疗单位：台南市立安南医院 06-3553111 | 奇美医院永康分院 06-2812811 | 成大医院 06-2353535• 妈祖宫里里长 林志英：06-2840205 | 天然气瓦斯(东和)：06-2589512\n[/TABLE]\n\n4.6 Termination - 善后处理\n环境侦检：灾害控制稳定时，为确保无其他危害源再度发生，需进行环境侦检作业。火灾：使用热像仪进行异常点及环境量测，确认现场温度；化灾：使用侦检仪器进行环境侦检无读值或使用pH试纸检测事故点趋近于中性。\n环境除污：受污染环境，应使用中和剂（例：柠檬酸、小苏打、敌腐灵等）进行环境酸碱中和，使用pH试纸检测事故点趋近于中性。\n事故点封锁：使用围篱或封锁线，进行灾害事故点封锁，避免其他人员误入，并张贴『异常事故区域未经EHS许可请勿进入』，后续调查事故真因。\n人员除污：去除或中和在人或设备污染源，降低有害污染区域避免二次污染，防止不相容化学品混合，避免有害物质渗透防护衣。需除污人员为：a. 遭受化学品喷溅污染人员；b. 事故抢救组人员；c. 协助抢救组除污人员。\n人员生理评估、器材清点复归与有害废弃物丢弃：救灾人员长时间处于高压环境可能导致生理负荷，救护人员于救灾结束后进行生理评估（生理数值监控、身体评估）。救灾结束后清点本次救灾器材并记录补齐；沾染有害物质应变器材应丢弃于有害事业废弃物处理桶(袋)妥善处理。", "html": "<p>灾害现场抢救标准作业程序(H.A.Z.M.A.T.)，起源于20世纪，当时全球工业化快速发展，事故发生时无专业应变处理小组处理，故许多国家建立应变处理小组，而H.A.Z.M.A.T.目前为美国消防(NFPA 注8)、台湾消防(NFA)及多数高科技厂广泛使用的灾害应变战术手法之一，透过指挥战术加以吓阻灾害扩延。</p><h4 class=\"vsub\">4.1 Hazard identification - 危害辨识</h4><p>掌握灾害现场危害风险等资讯并快速回报：火灾类型(A.B.C.D类)、化学品性质与反应性(依SDS注10)、储存数量及位置、受伤人数、复合式灾害。取得危害辨识资料可透过化学品 SDS、ERG注11、化学品应变对策系统获取资讯。</p><p>安全资料表 (SDS) 十六项揭露资讯（应变时以重点项次作为参考）：</p><table><tr><th>项次 1–4</th><th>项次 5–8</th><th>项次 9–12</th><th>项次 13–16</th></tr><tr><td>1. 化学品与厂商资料</td><td>5. 灭火措施（紧急应变）</td><td>9. 物理及化学性质（预防措施）</td><td>13. 废弃物处置方法</td></tr><tr><td>2. 危害辨识资料（危害辨识）</td><td>6. 泄漏处理方法（紧急应变）</td><td>10. 安定性与反应性（预防措施）</td><td>14. 运送资料</td></tr><tr><td>3. 成分辨识资料</td><td>7. 安全处置与储存方法</td><td>11. 毒性资料</td><td>15. 法规资料</td></tr><tr><td>4. 急救措施（紧急应变）</td><td>8. 暴露预防措施（预防措施）</td><td>12. 生态资料</td><td>16. 其他资料</td></tr></table><p>紧急应变指南 (ERG) 页面介绍</p><p>黄色：联合国编号 (UN No.)；蓝色：英文名称；紫色：中文名称。</p><p>当黄色、蓝色或紫色框页化学品以底色标记时，表示该化学品为吸入性毒性危害(TIH)物质（如氯气及氨气等）。</p><p>处理原则编号备注「P」者，表示此物质受热或受污染时，会产生剧烈的聚合反应。</p><p>查到处理原则后，便能查到：潜在危害（健康危害、火灾或爆炸）、公共安全（相关资讯、防护衣、疏散）、紧急应变（火灾、泄漏，以及最初医疗急救之行动建议方案）。</p><p>绿色页面：初期隔离和防护行动距离表、危险的禁水性物质（提供初期隔离距离与保护行动距离两种不同类型安全距离建议；保护行动距离分为大小量及日夜间等泄漏情境）、常见的六种吸入性毒性危害物质。</p><p>大量泄漏：大于208公升(55加仑)；小量泄漏：小于或等于208公升(55加仑)。</p><p>化学品应变对策 App (HCARD) 操作说明</p><p>化学品应变App，收集厂内250种化学品种类，汇集化学品SDS及ERG紧急应变指南资讯，透过iPad扫描条码或者手机触碰NFC位置，即可随手可得应变对策，且张贴于厂内高风险区域，让同仁于第一时间能快速应变。</p><p>iPad 扫描 QR Code：Step 1 点选 iPad QR Code → Step 2 扫描化学品应变对策上 QR Code → Step 3 输入 email、password → Step 4 开启 Power apps 应用程式 → Step 5 输入关键字搜寻。</p><p>手机触碰 NFC：Step 1 手机触碰 NFC 贴纸（需紧贴触碰）→ Step 2 开启 Power apps 应用程式 → Step 3 输入关键字搜寻。</p><p>系统查询功能：介面功能：① 关键字输入 → ② 关键字相关化学品搜寻浏览 → ③ 检视厂内化学品成分、特征、危害、物化特性、衍生物及不相容物 → ④ 检视应变处理方法及注意事项（火灾处理/泄漏处理/急救方法）→ ⑤ 开启「检视处理原则」可查看该物质 ERG 处理原则与 PPE 建议。</p><h4 class=\"vsub\">4.2 Action plan - 行动方案</h4><p>行动方案流程：拟定救灾计划 → ERT集结 → 紧急应变器材 → 区域管制划分 → 应变处置。</p><p>救灾计划包含：1. 危害认知；2. ERT成员（监控指挥官、现场指挥官、抢救组、管制组、支援组、救护组）；3. 应变作为（进攻型应变、防守型应变）；4. 区域管制范围（冷、暖、热区封锁线划分）；5. 除污站架设位置；6. 人员是否疏散。</p><p>ERT集结：由 ERC/CCR注12 使用口语广播，通知事故部门ERT进行集结，并由现场指挥官下达组织任务（抢救组、管制组、支援组、急救组）。</p><p>各类防护衣级别分类说明</p><table><tr><th>分类项目</th><th>Level A</th><th>Level B</th><th>Level C</th><th>消防衣</th></tr><tr><td>美规分类</td><td>Level A</td><td>Level B</td><td>Level C</td><td>NFPA / EN469</td></tr><tr><td>欧规分类</td><td>Type 1 (液态或气态)</td><td>Type 2 (非气密式)Type 3 (液密式)</td><td>Type 4 (防喷沫式)Type 5 (防微粒式)</td><td>EN469:2020EN 465</td></tr><tr><td>穿戴时机</td><td>环境为密闭空间且有未知危害，需要最高级别的皮肤、眼睛与呼吸防护设备</td><td>环境中含氧量低于19.5%，需要最高级别的呼吸防护，但可以接受较低等级的皮肤防护设备</td><td>已识别危害来源，且确认不会被皮肤吸收或造成皮肤伤害</td><td>环境有爆炸或燃烧的疑虑</td></tr><tr><td>环境皮肤接触风险</td><td>剧毒化学固体或液体或气体，气体经皮肤产生 IDLH</td><td>剧毒化学固体或液体或气体，气体经皮肤不产生 IDLH</td><td>有害化学固体或液体或气体</td><td>火灾</td></tr><tr><td>对应皮肤 PPE</td><td>气密式防护衣</td><td>连身防护衣(含头罩)</td><td>连身或两件式防护衣(含头罩)</td><td>消防衣</td></tr><tr><td>环境吸入风险</td><td>缺氧</td><td>有害的气体或粉尘高于 PEL 值</td><td>有害的气体或粉尘低于 PEL 值</td><td>缺氧</td></tr><tr><td>对应呼吸 PPE</td><td>送气呼吸系统</td><td>送气或过滤呼吸系统</td><td>送气或过滤呼吸系统</td><td>送气呼吸系统</td></tr></table><p>各级防护衣与消防衣穿戴配备及注意事项</p><p>A级防护衣：穿戴时机：适用所有浓度未知情况下，物质浓度侦测超过立即危害浓度(IDLH)，可发挥呼吸、皮肤与眼睛最高程度防护。穿戴配备：A级防护衣、A级防护靴、SCBA注13、呼吸面罩、无线电。适用时机：① 气体泄漏处置 ② 化学品泄漏处置 ③ 未知气体处置 ④ 环境侦检。重点：若泄漏之气体有爆炸或燃烧的疑虑，则不可穿著A级防护衣。注意事项：  • 视觉屏蔽：仅有前视野镜面，左右视野遭遮蔽，视野受限。  • SCBA漏气：著装时确认气瓶是否漏气，避免防护衣膨胀。  • SCBA耗氧量：当气瓶压力低于 1/4 (1000 psi) 时，应立即退出事故点。  • 通讯设备异常：至事故现场需进行无线电通联测试，异常时进行无线电端子对接重接。  • 镜面起雾：使用双手或拔除肺力阀进行除雾动作。  • A级防护衣膨胀：SCBA或面罩漏气造成充气膨胀时，立即双手抱腹部内压排出空气，并进行漏气排除。</p><p>B级防护衣：穿戴时机：适用事故物质不会对皮肤造成严重伤害，但会对眼睛及呼吸系统造成严重伤害，亦用于缺氧环境。穿戴配备：C级防护衣、C级防护靴、SCBA、呼吸面罩、抗化手套、安全帽、无线电。适用时机：① 气体泄漏处置 ② 化学品泄漏处置 ③ 环境侦检 ④ 缺氧环境。重点：若泄漏之气体有爆炸或燃烧的疑虑，则不可穿著B级防护衣。</p><p>C级防护衣：穿戴时机：适用空气中有害物气体浓度经侦检低于立即危害浓度时、无直接接触有害物质液体或粉尘及人员除污时。穿戴配备：C级防护衣、C级防护靴、滤毒罐、猪鼻子、护目镜、耐酸碱手套、安全帽。适用时机：① 低浓度灾害处置 ② 环境侦检 ③ 环境复归 ④ 人员除污。重点：若泄漏之气体有爆炸或燃烧的疑虑，则不可穿著C级防护衣。</p><p>消防衣：穿戴时机：适用于高温及有火源之事故现场。穿戴配备：消防衣裤、防焰头套、消防靴、SCBA、呼吸面罩、无线电、消防帽。适用时机：① 各类火灾处置 ② 高温场所异常处置 ③ 易燃性气体异常处置 ④ 环境侦检。重点：若有毒泄漏之气体疑虑，则不可穿著消防衣（同时注意SCBA漏气与通讯设备检查）。</p><p>C级防护衣滤毒罐差异性 (NIOSH 注14 颜色编码系统)</p><table><tr><th>颜色标签</th><th>范例型号</th><th>适用危害物质</th></tr><tr><td>黑色</td><td>3M 6001</td><td>由溶剂产生的有机蒸气（例如：油漆及稀释剂所释出的有机蒸气）</td></tr><tr><td>白色</td><td>3M 6002</td><td>氯气、硫化氢、与二氧化硫等酸性气体</td></tr><tr><td>黄色</td><td>3M 6003</td><td>有机蒸气与氯气、盐酸、二氧化硫、氢氟酸及其他酸性气体</td></tr><tr><td>绿色</td><td>3M 6004</td><td>适用于滤除氨或甲胺(methylamine)等碱性有害物质</td></tr></table><p>滤毒罐破出：滤毒罐在应变过程中，当您吸入异味时，代表滤毒罐内纤维层及活性碳层已饱和，且有破出现象（饱和度 30% → 60% → 破出），必须进行滤毒罐更换确保自身安全。公式：滤毒罐防护时间 = 标准检测浓度 × 实际防护时间 / 现场检测浓度。</p><p>紧急应变器材设置说明与各厂区紧急应变柜点位</p><p>法源依据：一、职安法第37条（事业单位工作场所发生职业灾害，雇主应即采取必要之急救、抢救等措施）；二、Global ERT Standard。设置原则：1. 化学品危害；2. 电器/火灾类危害；3. 集结点考量；4. 无尘室入口为必要设置点位；5. 参考公共危险物品及可燃性高压气体设置区，相邻 200M 可支援器材点位。</p><table><tr><th>厂区</th><th>数量统计</th><th>详细点位分布</th></tr><tr><td>F11 (MTTW)</td><td>共10组点位(A级5柜、B级2柜、C级59~64柜、消防衣3组)</td><td>• 5F：FAB-C、CUB-1B、S/B(FAB-B, FAB-C)• 4F：FAB-A、CUB-1B、CUB-1、CUB-2• 3F：FAB-B、FAB-A、FAB-C、CUB-1A• 2F：FAB-A、FAB-B、FAB-C、CUB-2• 1F：FAB-A、FAB-B、FAB-C、CUB-1B</td></tr><tr><td>FAB16 / F16 (MMT)</td><td>紧急应变柜 28组简易型应变柜 3组(设有灯号提醒)</td><td>• Office：OB 4-1、OB 4-2 (定点)• A1 FAB：5F C/R(简易)、2F A1 FAB 2-1(定点)、1F A1 FAB 1-1 / 1-2、1F A1 HPM 1-1、LB1 A1 FAB B1-1• A2 SUP/FAB：5F A2 FAB 5-1、2F A2 FAB 2-1、1F A2 HPM 1-1、LB1 A2 FAB B1-1、5F C/R(简易)、2F C/R(简易)• A3 Phase 1/2：5F A3 HPM 5-1 / A3 FAB 5-1、4F A3 HPM 4-1、3F A3 FAB 3-1/3-2 / A3 HPM 3-1、2F A3 HPM 2-1、1F A3 HPM 1-1 / 1-2、B1F A3 HPM B1-1• 周边栋别：CUB (A1&amp;A2 CUB2-1, CUB2-2)、WH (A1&amp;A2 WH 1-1)、Dormitory (宿舍1-1)、A3 CUP (A3 CUB 3-1, CUB 2-1)、W/H (A3 W/H 1-1)</td></tr><tr><td>MTB</td><td>紧急应变柜 6组(设有灯号提醒)</td><td>• FAB 3F：FAB-1、FAB-2 (3F定点)• SB 1F：SB-1、SB-2 (厂务监控室旁)• CUP：2F CUP-2、1F CUP-1</td></tr><tr><td>TCP</td><td>紧急应变柜 4组(设有灯号提醒)</td><td>• Office 1F (Lobby大厅)：OB-1、OB-2• CUP 2F：CUP-1、CUP-2</td></tr><tr><td>AATT</td><td>紧急应变柜 5组</td><td>• Office-2：2F Security check point• FAB：5F C/R入口处、3F C/R入口处• CUB：5F 2号梯旁</td></tr></table><h4 class=\"vsub\">4.3 Zone - 区域管制与环境侦检</h4><p>火灾管制区域划分：楼层划分：以火灾事故点以上楼层为管制区域（Ex: 当4F火灾发生时，管制区域为整栋别，禁止人员进入，由管制组人员使用封锁线于1F出入口进行管制）。栋别划分：火势过大，造成栋别灾害扩大时，则进行该栋别出入口封锁管制（1F各出入口禁止人员进入）。</p><table><tr><th>区域名称</th><th>标示颜色</th><th>区域定义与装备规定</th></tr><tr><td>热区 (Hot Zone)</td><td>红色</td><td>又称污染区或禁区，为事故地点周围可能遭受污染区域，化学品浓度可能超过 TWA/STEL/IDLH 造成人员死亡或严重影响健康风险，使用红色热区封锁线。须著消防衣或 A级防护衣。</td></tr><tr><td>暖区 (Warm Zone)</td><td>黄色</td><td>又称影响区或除污区，为热区与冷区间缓冲区域，化学品浓度低于 TWA/STEL/IDLH 但高于一般背景值，功用为除污区域，使用黄色暖区封锁线。须著 C级防护衣，设除污走道。</td></tr><tr><td>冷区 (Cold Zone)</td><td>蓝色(绿色封锁线)</td><td>又称安全区或支援区，为未受污染或已除污区域，使用绿色冷区封锁线。注意事项：1. 指挥站应设于冷区及上风位置；民众、记者则在冷区之外。2. 管制组对于出入管制区之抢救人员应记录管制，禁止未著适当防护装备人员出入。</td></tr></table><p>首次接近事故现场侦检要领：1. 应变人员安全为第一优先；2. 穿著适当防护衣(PPE)；3. 考量事故点风向，并由上风处靠近事故点，由外至内进行侦检，以降低污染风险；4. 采二进/二出双人小组系统；5. 并依侦检数据划设热、暖、冷区。</p><p>未知化学品连续监测顺序：1. 缺氧/富氧：量测氧气浓度（例：O2 侦测范围 0~25.0%，Alarm1: 19.5 vol%，Alarm2: 18.0 vol%）；2. 易燃性：量测爆炸下限(LEL)；3. 腐蚀性：量测pH值；4. 毒性：量测有毒物质种类及浓度；5. 事故地点：密闭或开放空间；6. 化学品蒸气密度：比空气重或轻。</p><p>侦检三阶段：初期（辨识化学品种类及危害、评估健康危害、选用防护具、决定控制区域、制定员工保护措施）→ 中期（判断泄漏来源、环境浓度、评估作业安全性、确认控制有效性）→ 后期（危害暴露纪录、评估现场是否已无潜在危害、确认环境浓度已无读值）。</p><p>爆炸界限与化学品危害暴露指标：UEL 爆炸上限：可燃性气体、蒸气或粉体与空气混合形成可燃性混合物接触火源，能被引燃或引爆之最高浓度。LEL 爆炸下限：能被引燃或引爆之最低浓度。（参考 SDS 第九项物理及化学特性）PEL 容许浓度：中央主管机关所订定作业环境中有害物质容许暴露标准。PEL-TWA（八小时日时量平均容许浓度）：劳工每天工作八小时，一般劳工重复暴露此浓度下，不致有不良反应。PEL-STEL（短时间时量平均容许浓度）：劳工连续暴露在此浓度任何十五分钟，不致有不可忍受之刺激、慢性或不可逆组织病变、麻醉昏晕作用。IDLH：生命、健康立即危险性，暴露为30分钟内不引起不可恢复健康效应之最大浓度。（参考 SDS 第八项暴露预防措施）</p><h4 class=\"vsub\">4.4 Managing - 应变组织</h4><p>成立灾害应变组织，并各司其职，各组别指派一名小组长，带领组员细分应变任务并回报：</p><p>指挥官：现场指挥官进行现场危害告知，并分配组别进行抢救任务，随时掌握各组行动并回报监控指挥官直至任务结束。</p><p>抢救组：负责灾害异常处理，含人员搜救等任务，并以通讯设备回报现场指挥官目前抢救任务阶段，直至灾害结束。</p><p>管制组：负责区域管制，执行冷区区域管制及封锁，禁止非相关人员进入至事故现场，严加控管人员出入情形，引导外部支援车辆入厂等。</p><p>支援组：负责提供各种支援，包括应变器材物资供应，确保应变小组在任何情况下都能获得所需的资源和支援。</p><p>急救组：1. 负责伤患救治医疗评估，并依伤患情况判定是否须就医；2. 抢救组、除污人员应于任务结束后，至救护站进行生理评估。</p><h4 class=\"vsub\">4.5 Assistance - 外界支援</h4><p>灾害超出厂内应变能力时，指挥官决策请求政府/友厂机构援助，并进行事故应变转移。联防组织包含：政府机关/消防队、友厂支援、学者与专家（环境事故专业技术小组）、地区医院。</p><p>指挥权转移：当外部单位成立指挥中心后，指挥权由外部单位权责指挥（EX：火灾-消防局、化灾-环保局）；事故应变转移时，须第一时间通知中部科学园区管理局；公司人员调度仍由区域紧急应变小组指挥官（事故发生部门M3主管或以上职等）负责。</p><table><tr><th>厂区</th><th>外部支援单位及联络电话</th></tr><tr><td>MTTW</td><td>• 坪顶消防队：03-3280309• 桃园市政府警察局龟山分局大华派出所：03-3975557• 桃园市政府：03-3322101• 桃园市政府环境保护局：03-3386021• 华亚科技园区服务中心：03-3970000• 北区职业安全卫生中心：02-89956700• 林口长庚纪念医院：03-3281200</td></tr><tr><td>F16 / MTB</td><td>• 后里消防队：25562600• 大甲分局后里分驻所：25562037</td><td>义里派出所：25562333• 内政部警政署保安警察第二总队：25584750• 台中市政府：22289111</td><td>台中市政府环保局：22289111、22276011• 中部科学园区管理局：25658588• 中区职业安全卫生中心：22550633（毒灾联防小组依 ENVIRONMENTAL PROTECTION SECTION 提供之友厂通讯录）• 邻里长：后里里 杨春明 25573325</td><td>厚里里 黄金益 25586747</td><td>公馆里 冯咏淮 25560459</td><td>广福里 郭明洲 25566205• 医疗单位：中国医药大学附设医院丰原分院 25222538#119</td><td>中国医药大学附设医院 22052121</td><td>卫福部丰原医院 25271180#2198</td><td>台中荣总 23592525#3611</td></tr><tr><td>MTTN</td><td>• 台南市消防局：06-2975119</td><td>土城消防分队(救护车)：06-2575276• 台南市政府警察局第三分局：06-2567666 / 2567005• 台南市政府：06-2991111</td><td>台南市政府环境保护局：06-2686751• 台南科工区服务中心：06-3840234~5• 南区职业安全卫生中心：07-2354861• 医疗单位：台南市立安南医院 06-3553111</td><td>奇美医院永康分院 06-2812811</td><td>成大医院 06-2353535• 妈祖宫里里长 林志英：06-2840205</td><td>天然气瓦斯(东和)：06-2589512</td></tr></table><h4 class=\"vsub\">4.6 Termination - 善后处理</h4><p>环境侦检：灾害控制稳定时，为确保无其他危害源再度发生，需进行环境侦检作业。火灾：使用热像仪进行异常点及环境量测，确认现场温度；化灾：使用侦检仪器进行环境侦检无读值或使用pH试纸检测事故点趋近于中性。</p><p>环境除污：受污染环境，应使用中和剂（例：柠檬酸、小苏打、敌腐灵等）进行环境酸碱中和，使用pH试纸检测事故点趋近于中性。</p><p>事故点封锁：使用围篱或封锁线，进行灾害事故点封锁，避免其他人员误入，并张贴『异常事故区域未经EHS许可请勿进入』，后续调查事故真因。</p><p>人员除污：去除或中和在人或设备污染源，降低有害污染区域避免二次污染，防止不相容化学品混合，避免有害物质渗透防护衣。需除污人员为：a. 遭受化学品喷溅污染人员；b. 事故抢救组人员；c. 协助抢救组除污人员。</p><p>人员生理评估、器材清点复归与有害废弃物丢弃：救灾人员长时间处于高压环境可能导致生理负荷，救护人员于救灾结束后进行生理评估（生理数值监控、身体评估）。救灾结束后清点本次救灾器材并记录补齐；沾染有害物质应变器材应丢弃于有害事业废弃物处理桶(袋)妥善处理。</p>"}, {"title": "火灾救灾技术", "text": "Chapter 05 火灾-救灾技术认知\n5.1 火灾浓烟判读 (V-V-C-D)\n浓烟观念：可燃物受热分解出的可燃性气体并混杂许多物质（悬浮粒子、瓦斯、高分子聚合物等），与空气混合后达 LEL~UEL 范围内也是会燃烧。透过浓烟的量、速度、颜色与密度，可得知火场状况、火点位置、建筑物是否坍崩、是否发生闪燃/爆燃及灭火战术使用。\n\n[TABLE 12 | 5 rows]\n判读要素 | 判读标准与火场意义\n第一个 V — 浓烟量 (Volume) | 1. 判断可燃物多寡（可燃物少-浓烟少，可燃物多-浓烟多）。2. 判断火灾初期或全盛期（全盛期-浓烟多）。3. 判断通风良好或不良（通风好-浓烟少，通风不良-浓烟多）。4. 判断可燃物干湿程度（干燥物体-浓烟少，潮湿物体-浓烟多）。\n第二个 V — 浓烟速度 (Velocity) | 1. 由浓烟离开火场的速度可得知火场温度高低。2. 判断是否可能发生闪燃现象。3. 越靠近火点（温度最高地方）烟流越快。\n第三个 C — 浓烟颜色 (Color) | 1. 判断目前火场的燃烧阶段（初期-白、成长期-灰、全盛期-黑）。2. 燃烧木材多为白色、棕色烟；燃烧塑胶多为黑色烟；燃烧特殊化学物品则可能产生黄色、绿色等特殊颜色的烟。3. 越靠近火点，烟流速率越快、颜色越黑。4. 浓烟的颜色越黑则温度越高（热分解越多）。\n第四个 D — 浓烟密度 (Density) | 1. 浓烟内部可燃性物质越多其密度越高越浓（可燃物多）。2. 浓厚烟流的分布情况，可得知是否会引发闪燃、爆燃。\n[/TABLE]\n\n5.2 闪燃、爆燃差异性\n闪燃 (Flashover)：指火场所有物品被瞬间、同时引燃。系指辐射热加剧，当到一定燃点时，瞬间烧起，造成全面燃烧。\n爆燃 (Backdraft)：指火场为缺氧燃烧时，因大量新鲜空气冲入现场，而导致剧烈燃烧，瞬间引爆。\n5.3 火场中性带\n火场中性带是指在火灾现场，烟囱效应导致浓烟蓄积到天花板后开始下降，形成一条明显的分界，即冷热空气对流达平衡的界线。影响因素：a. 温度（室内火灾温度愈高，中性带会往下偏移）；b. 压力（氧气供应不足、通风控制燃烧时，中性带会往上偏移）。判读：温度低、中性带高（浓烟少、冷空气多）；温度高、中性带低（浓烟多、冷空气少）。\n5.4 火场开门程序\n目的：提前预判门后燃烧状态并采取战术，减少因开门制造开口使氧气迅速进入产生对流而引发闪燃、爆燃之风险。\n进行火场开门前：1. 观察门缝是否有浓烟或火焰窜出。2. 判断浓烟窜出的位置与 VVCD。3. 有看到浓烟、火一定要对门板上缘、两侧进行射水降温，可以增加温度辨识度。4. 使用 TIC(热像仪)进行门扇温度差判定（TIC显示：红色-火源、黑色-温度高、白色-温度低）。\n进行火场开门时：1. 开门时，由抢救组 B 员至门上侧边开启门扇，抢救 A 员射水 2 秒后，抢救组 B 员迅速关闭门扇。2. 使用 TIC(热像仪)进行温度差判定。3. 如温度尚未降低，请重复开关门射水动作，直至温度降低为止（射水至火场快速凝结成水蒸气可达冷却效果）。\n5.5 灭火战术\n进攻型灭火：抢救组人员至火场中，以火源起始点（火点-温度最高处），从最外层打至最内层起火点，通常以水柱射水方式进行灭火。\n防守型灭火：抢救组人员不进火场，主要是射水降温、阻隔延烧并移除周围可能延烧之可燃物，避免灾害持续扩大并保护周围建筑物，通常以水柱、水雾方式进行防护。（备注：执行灭火任务时，禁水性物质化学品严禁射水，射水前应确认该区域存放物质。）\n5.6 灭火器介绍及操作\n法规依据：依据消防法『各类场所消防安全设备设置标准』第31条第三项，设有灭火器之楼层，自楼面居室任一点至灭火器之步行距离在二十公尺以下。常见为干粉灭火器与二氧化碳灭火器。操作步骤：1. 拉插销 → 2. 瞄准火源底部 → 3. 压握把 → 4. 扫向火源左右扫射。\n5.7 室内、外消防栓操作\n5.7.1 室内消防栓(箱)：结构包含：启动灯、区域警铃、火警指示灯、手动报警机、PBL盘、消防栓阀、水带、瞄子。操作口诀「按、开、拿、拉、转」：1. 按警铃 → 2. 开室内消防栓箱门 → 3. 拿瞄子 → 4. 拉水带（水带需拉直，避免弯折爆管）→ 5. 转制水阀。\n5.7.3 & 5.7.4 室外消防栓：通常设置于工业厂房或仓库等建筑物，防护范围为建筑物一楼、二楼以及外墙。设备包含地上型消防栓（2-1/2吋出水口）、室外水带箱（水带、瞄子、开关板手）。操作步骤：1. 开消防栓箱门取水带 → 2. 接水带衔接消防栓上 → 3. 水带衔接瞄子或砲塔 → 4. 开启消防栓开关阀 → 5. 消防射水。\n5.8 涡轮式瞄子操作\n主要分为 2-1/2 吋（适用室外消防栓水带）及 1-1/2 吋（适用室内消防栓水带）两种：\n\n[TABLE 13 | 7 rows]\n项次 | 名称 | 功能说明\n1 | 握把 | 稳定功能\n2 | 水流开关 | 控制出水量（前推送水、后推关水）\n3 | 水流速调节旋钮 | 控制流速\n4 | 水分子大小调节旋钮 | 控制水分子大小（逆时针水雾状、顺时针水柱状）\n5 | 快速接头(母接头) | 进水端（与水带公接头连接）\n6 | 前端出水口 | 出水端\n[/TABLE]\n\n5.9 移动式砲塔操作\n因体积小、重量轻、机动性高，常用于抢救组无法接近火场或当下人力不足时使用，也适用于攻击、防护危险物质等情况。\n\n[TABLE 14 | 8 rows]\n项次 | 名称 | 功能说明\n1 | 支撑脚座 | 展开后固定于地板，支撑水柱发射后坐力\n2 | 快速接头(母接头) | 可连接消防栓阀之水带(公接头)\n3 | 控制把手 | 控制水柱方向\n4 | 上下方向控制旋钮 | 旋开后可控制水柱上下移动\n5 | 左右方向控制旋钮 | 旋开后可控制水柱左右移动\n6 | 涡轮瞄子 | 可调整水滴大小（雾状或水柱状）\n7 | 水压压力计 | 确认水压高低\n[/TABLE]\n\n操作步骤：1. 拉起脚座拉环 → 2. 打开脚座 → 3. 装上水带 → 4. 转开旋钮控制方向(上下) → 5. 转开旋钮控制方向(左右) → 6. 确认目标位置 → 7. 调整水雾或水柱。\n5.10 电动车灭火毯 / 底盘洒水器设置及操作\n设置位置：• MTTW：H/Q B1F停车场人员入口处、CUB-6 B1F 消防泵浦室前；• MMT：A3 Parking B1F 北侧 B/16柱位、南侧 C/7柱位；• MTB：OB Parking B3F、OB 南侧梯厅间、B1栋户外草皮上应变推车。\n灭火毯操作方式：1. 灭火毯自携行袋取出 → 2. 红色拉带对准目标车辆，短边中位线对准车辆中线 → 3. 撕开固定带 → 4. 拉开灭火毯红色拉带，中位线对齐车辆中间 → 5. 灭火毯遮盖车辆 → 6. 将灭火毯四周包围，阻隔空气。\n电动车底盘洒水器操作方式：1. 定位(上风处)：建议以车辆两侧底盘为前进目标对齐，如因现场空间受限则以车头、尾为方向 → 2. 接水带：停车场为室内消防栓应接上1.5吋转接头 → 3. 注水、推进：注水后可利用水袋充水结实特性作为支点依目标方向前进 → 4. 搭配车用灭火毯使用时，应先覆盖灭火毯再掀开一侧将底盘洒水器放入车底。", "html": "<h4 class=\"vsub\">5.1 火灾浓烟判读 (V-V-C-D)</h4><p>浓烟观念：可燃物受热分解出的可燃性气体并混杂许多物质（悬浮粒子、瓦斯、高分子聚合物等），与空气混合后达 LEL~UEL 范围内也是会燃烧。透过浓烟的量、速度、颜色与密度，可得知火场状况、火点位置、建筑物是否坍崩、是否发生闪燃/爆燃及灭火战术使用。</p><table><tr><th>判读要素</th><th>判读标准与火场意义</th></tr><tr><td>第一个 V — 浓烟量 (Volume)</td><td>1. 判断可燃物多寡（可燃物少-浓烟少，可燃物多-浓烟多）。2. 判断火灾初期或全盛期（全盛期-浓烟多）。3. 判断通风良好或不良（通风好-浓烟少，通风不良-浓烟多）。4. 判断可燃物干湿程度（干燥物体-浓烟少，潮湿物体-浓烟多）。</td></tr><tr><td>第二个 V — 浓烟速度 (Velocity)</td><td>1. 由浓烟离开火场的速度可得知火场温度高低。2. 判断是否可能发生闪燃现象。3. 越靠近火点（温度最高地方）烟流越快。</td></tr><tr><td>第三个 C — 浓烟颜色 (Color)</td><td>1. 判断目前火场的燃烧阶段（初期-白、成长期-灰、全盛期-黑）。2. 燃烧木材多为白色、棕色烟；燃烧塑胶多为黑色烟；燃烧特殊化学物品则可能产生黄色、绿色等特殊颜色的烟。3. 越靠近火点，烟流速率越快、颜色越黑。4. 浓烟的颜色越黑则温度越高（热分解越多）。</td></tr><tr><td>第四个 D — 浓烟密度 (Density)</td><td>1. 浓烟内部可燃性物质越多其密度越高越浓（可燃物多）。2. 浓厚烟流的分布情况，可得知是否会引发闪燃、爆燃。</td></tr></table><h4 class=\"vsub\">5.2 闪燃、爆燃差异性</h4><p>闪燃 (Flashover)：指火场所有物品被瞬间、同时引燃。系指辐射热加剧，当到一定燃点时，瞬间烧起，造成全面燃烧。</p><p>爆燃 (Backdraft)：指火场为缺氧燃烧时，因大量新鲜空气冲入现场，而导致剧烈燃烧，瞬间引爆。</p><h4 class=\"vsub\">5.3 火场中性带</h4><p>火场中性带是指在火灾现场，烟囱效应导致浓烟蓄积到天花板后开始下降，形成一条明显的分界，即冷热空气对流达平衡的界线。影响因素：a. 温度（室内火灾温度愈高，中性带会往下偏移）；b. 压力（氧气供应不足、通风控制燃烧时，中性带会往上偏移）。判读：温度低、中性带高（浓烟少、冷空气多）；温度高、中性带低（浓烟多、冷空气少）。</p><h4 class=\"vsub\">5.4 火场开门程序</h4><p>目的：提前预判门后燃烧状态并采取战术，减少因开门制造开口使氧气迅速进入产生对流而引发闪燃、爆燃之风险。</p><p>进行火场开门前：1. 观察门缝是否有浓烟或火焰窜出。2. 判断浓烟窜出的位置与 VVCD。3. 有看到浓烟、火一定要对门板上缘、两侧进行射水降温，可以增加温度辨识度。4. 使用 TIC(热像仪)进行门扇温度差判定（TIC显示：红色-火源、黑色-温度高、白色-温度低）。</p><p>进行火场开门时：1. 开门时，由抢救组 B 员至门上侧边开启门扇，抢救 A 员射水 2 秒后，抢救组 B 员迅速关闭门扇。2. 使用 TIC(热像仪)进行温度差判定。3. 如温度尚未降低，请重复开关门射水动作，直至温度降低为止（射水至火场快速凝结成水蒸气可达冷却效果）。</p><h4 class=\"vsub\">5.5 灭火战术</h4><p>进攻型灭火：抢救组人员至火场中，以火源起始点（火点-温度最高处），从最外层打至最内层起火点，通常以水柱射水方式进行灭火。</p><p>防守型灭火：抢救组人员不进火场，主要是射水降温、阻隔延烧并移除周围可能延烧之可燃物，避免灾害持续扩大并保护周围建筑物，通常以水柱、水雾方式进行防护。（备注：执行灭火任务时，禁水性物质化学品严禁射水，射水前应确认该区域存放物质。）</p><h4 class=\"vsub\">5.6 灭火器介绍及操作</h4><p>法规依据：依据消防法『各类场所消防安全设备设置标准』第31条第三项，设有灭火器之楼层，自楼面居室任一点至灭火器之步行距离在二十公尺以下。常见为干粉灭火器与二氧化碳灭火器。操作步骤：1. 拉插销 → 2. 瞄准火源底部 → 3. 压握把 → 4. 扫向火源左右扫射。</p><h4 class=\"vsub\">5.7 室内、外消防栓操作</h4><p>5.7.1 室内消防栓(箱)：结构包含：启动灯、区域警铃、火警指示灯、手动报警机、PBL盘、消防栓阀、水带、瞄子。操作口诀「按、开、拿、拉、转」：1. 按警铃 → 2. 开室内消防栓箱门 → 3. 拿瞄子 → 4. 拉水带（水带需拉直，避免弯折爆管）→ 5. 转制水阀。</p><p>5.7.3 &amp; 5.7.4 室外消防栓：通常设置于工业厂房或仓库等建筑物，防护范围为建筑物一楼、二楼以及外墙。设备包含地上型消防栓（2-1/2吋出水口）、室外水带箱（水带、瞄子、开关板手）。操作步骤：1. 开消防栓箱门取水带 → 2. 接水带衔接消防栓上 → 3. 水带衔接瞄子或砲塔 → 4. 开启消防栓开关阀 → 5. 消防射水。</p><h4 class=\"vsub\">5.8 涡轮式瞄子操作</h4><p>主要分为 2-1/2 吋（适用室外消防栓水带）及 1-1/2 吋（适用室内消防栓水带）两种：</p><table><tr><th>项次</th><th>名称</th><th>功能说明</th></tr><tr><td>1</td><td>握把</td><td>稳定功能</td></tr><tr><td>2</td><td>水流开关</td><td>控制出水量（前推送水、后推关水）</td></tr><tr><td>3</td><td>水流速调节旋钮</td><td>控制流速</td></tr><tr><td>4</td><td>水分子大小调节旋钮</td><td>控制水分子大小（逆时针水雾状、顺时针水柱状）</td></tr><tr><td>5</td><td>快速接头(母接头)</td><td>进水端（与水带公接头连接）</td></tr><tr><td>6</td><td>前端出水口</td><td>出水端</td></tr></table><h4 class=\"vsub\">5.9 移动式砲塔操作</h4><p>因体积小、重量轻、机动性高，常用于抢救组无法接近火场或当下人力不足时使用，也适用于攻击、防护危险物质等情况。</p><table><tr><th>项次</th><th>名称</th><th>功能说明</th></tr><tr><td>1</td><td>支撑脚座</td><td>展开后固定于地板，支撑水柱发射后坐力</td></tr><tr><td>2</td><td>快速接头(母接头)</td><td>可连接消防栓阀之水带(公接头)</td></tr><tr><td>3</td><td>控制把手</td><td>控制水柱方向</td></tr><tr><td>4</td><td>上下方向控制旋钮</td><td>旋开后可控制水柱上下移动</td></tr><tr><td>5</td><td>左右方向控制旋钮</td><td>旋开后可控制水柱左右移动</td></tr><tr><td>6</td><td>涡轮瞄子</td><td>可调整水滴大小（雾状或水柱状）</td></tr><tr><td>7</td><td>水压压力计</td><td>确认水压高低</td></tr></table><p>操作步骤：1. 拉起脚座拉环 → 2. 打开脚座 → 3. 装上水带 → 4. 转开旋钮控制方向(上下) → 5. 转开旋钮控制方向(左右) → 6. 确认目标位置 → 7. 调整水雾或水柱。</p><h4 class=\"vsub\">5.10 电动车灭火毯 / 底盘洒水器设置及操作</h4><p>设置位置：• MTTW：H/Q B1F停车场人员入口处、CUB-6 B1F 消防泵浦室前；• MMT：A3 Parking B1F 北侧 B/16柱位、南侧 C/7柱位；• MTB：OB Parking B3F、OB 南侧梯厅间、B1栋户外草皮上应变推车。</p><p>灭火毯操作方式：1. 灭火毯自携行袋取出 → 2. 红色拉带对准目标车辆，短边中位线对准车辆中线 → 3. 撕开固定带 → 4. 拉开灭火毯红色拉带，中位线对齐车辆中间 → 5. 灭火毯遮盖车辆 → 6. 将灭火毯四周包围，阻隔空气。</p><p>电动车底盘洒水器操作方式：1. 定位(上风处)：建议以车辆两侧底盘为前进目标对齐，如因现场空间受限则以车头、尾为方向 → 2. 接水带：停车场为室内消防栓应接上1.5吋转接头 → 3. 注水、推进：注水后可利用水袋充水结实特性作为支点依目标方向前进 → 4. 搭配车用灭火毯使用时，应先覆盖灭火毯再掀开一侧将底盘洒水器放入车底。</p>"}, {"title": "化灾救灾技术", "text": "Chapter 06 化灾-救灾技术认知\n6.1 防守型、进攻型方法\n依据现场事故规模，分为防守型、进攻型两种应变方式，通常会先以防守型应变行动减少暴露影响范围后，随后再进行进攻型应变行动；若时间充足允许下，两种行动皆可同时进行。\n防守型应变（局限特定区域有效控制及围堵）：• 01 吸收法：借由润湿的程序使液体附著于固体，吸收剂体积随之膨胀，常以木屑、砂土方式进行吸收。• 02 吸附法：指化学品泄漏液体与中和剂表面相互吸附之方法。• 03 覆盖法：一种暂时性的控制方法，利用吸酸棉片进行覆盖。• 04 阻遏法(堤、坝、改道、截流)：以物理性阻隔法去阻止或减少外泄液流入环境的方法(NFPA)，为外泄控制最常使用的方法。• 05 蒸气驱散、压抑法：蒸气驱散法以洒水(水雾法)将蒸气驱散减低危害；蒸气压抑法使用抑制剂减少或消除发散的蒸气。\n进攻型应变（使用应变器材进行止漏、关紧或其他作为）：• 01 填塞与补贴法：填塞是将物质塞入漏洞或裂缝减少泄漏；贴补是将材料黏置于洞上使化学物不漏出，一般采用夹板或黏著剂固牢。• 02 转送(移槽)法：以人工、帮浦或加压输送等方式，将液体、气体或某些型态固体由受损容器(储槽)转移至另一容器。\n6.2 化学品泄漏围堵\n1. 穿著对应防护衣进行围堵及源头遮断，并确认漏液面积。2. 使用吸酸棉条、片由外向内、交叠进行围堵圈围，防止化学品持续扩散。3. 观察化学品泄漏源位置，围堵吓阻防止化学品溢流于低洼处。4. 止漏完成后，应使用中和剂进行环境除污，直至pH趋近于中性为止。5. 将沾染化学品吸酸棉等应变器材，装于有害废弃物处理桶(袋)并通知环保课后丢弃。\n6.3 ERCV 注15 砲车位置及使用时机\n使用时机：1. 适用于50L以下泄漏钢瓶；2. 气体钢瓶泄漏时，ERT小组人员无法对泄漏钢瓶止漏，且有污染环境之虞时立即启用；3. 待ERCV完成操作后，立即移至户外静待厂商收回处理。\n设置位置：• MTTW：FAB-B 1F南侧走道A18-8柱、FAB-C 1F资材库房走道；• MMT：A1 HPM 1F r/3柱位、A2 HPM 1F r/3柱位、A3 FAB 1F m/5柱位。\n注意事项：1. 需著A级防护衣方可操作，禁止地面磨擦影响防护效力；2. 确认ERCV内部已无任何压力，否则严禁开启法兰；3. 法兰开口应朝向开阔处，且45°夹角范围内严禁人员进入；4. 需2员相互作业，勿单独行动。\n禁止使用气体种类：1. 乙炔（超过 1.035 Barg 受撞或受热可能分解爆炸，不得倒置或滚动）；2. 强氧化性气体（如 N2O、ClF3、20%F2/N2、WF6）；3. 自燃性气体（如 SiH4、PH3、SiH2Cl2 等）；4. 爆炸性气体混合物（CH4、CF4、NF3、1%PH3/Ar、PGMEA、AsH3、CH2F2、CO、BF3 等）；5. 液满钢瓶；6. 仅能封装一支钢瓶。\n6.3.4 ERCV Model 5503 操作流程 (20步骤)：1. 按压柄侧辅助并控制碟煞移动ERCV → 2. 马鞍放至适当位置 → 3. 检视压力表转动压力阀确认归(0) → 4. 使用T型板手旋开上方螺帽 → 5. 旋开下方螺帽 → 6. 双手旋开螺帽（若有气体喷出立即锁上，勿以手指遮盖）→ 7. 开启密闭门 → 8. 取出小钢瓶固定架及固定链条 → 9. 保护泄漏钢瓶头阀件（避免防护衣摩擦破损）→ 10. 扶正泄漏钢瓶 → 11. 转紧钢瓶保护盖（若瓶头损坏立即使用Kit止漏）→ 12. 利用马鞍支点杠杆方式放入ERCV内部 → 13. 封装时泄漏源朝下、钢瓶头朝门 → 14. 以固定链条勾住滑轨孔洞避免滑动 → 15. 密闭门关闭前后端排放阀须保持开启 → 16. 检视 O-ring 状况避免附著脏污及损坏 → 17. 锁上并以T型板手旋紧上下安全螺帽 → 18. 关闭后端排放阀，侦检确认无读值 → 19. 环境侦检读值需为0 → 20. 填写标签贴版注明泄漏化学品交由厂商清运。\n6.3.5 ERCV HP 10 操作流程 (18步骤)：1. 用板手将螺帽松开后(泄压)再用手逆时钟转开 → 2. 逆时钟打开阀头进行泄压 → 3. 确认压力表头归0 → 4. 使用通用把手逆时钟转动排气螺杆 → 5. 用手逆时钟松开排气螺杆 → 6. 用通用把手逆时钟松开固定环扩张器 → 7. 将两个固定环向后拉 → 8. 将马鞍顺势取下 → 9. 将两边档板扣环取下 → 10. 钢瓶转至橡胶垫上 → 11. 利用杠杆原理将钢瓶放推入至砲车内 → 12. 推入后使用钢瓶固定板固定（需卡进钢瓶支架）→ 13. 向后拉将舱门开启（开启时人员站在门右方避免伤害）→ 14. 档板把手下拉后沿滑轨取出档板 → 15. 钢瓶放入后将档板把手往上拉固定钢瓶 → 16. 使用通用把手将舱门关回后轻推固定，顺时钟固定扩张环 → 17. 顺时钟锁上排气螺杆（需对准）→ 18. 锁上阀头及螺帽，注明化学品资讯交由厂商出场清运。\n6.4 除污帐篷操作\n设置地点：a. 冷区上风处，暖区至冷区交接点；b. 事故现场邻近冲身洗眼器。考量事项：位置选择(上风处/水源/地势)、除污人数、除污技术类型、天气状况、设备与水源供给、仪器除污可行性。\n厂区除污帐篷器材：C级防护衣、冲淋设备、吸酸棉片(条)、pH石蕊试纸、泄漏处理桶(袋)、消防水带、沉水泵、水管、清洗刷、中和剂、蓝白拖。\n6.4.2 冲身洗眼器除污设置：支援组于冲身洗眼器建置除污区并铺设吸酸棉片，抢救组冲淋后使用pH试纸检测PPE趋近中性，以吸酸棉擦干并脱除PPE；随后支援组自行脱除PPE丢至泄漏处理袋(桶)。\n6.4.3 除污帐篷三阶段除污：划分为三区：第一除污区（第一阶段：先使用清水及刷子清除污染物）→ 第二除污区（第二阶段：使用中和剂处理污染物，再使用清水二次清除污染物）→ 第三除污区（第三阶段：使用吸液棉擦干防护衣，并协助脱除）。\n除污帐篷搭设12步骤：1. 支援组搬运除污帐篷 → 2. 摊开并确认进出方向 → 3. 将钢瓶充气转接阀安装至空气钢瓶上 → 4. 打开帐篷充气口盖子并确认逆止阀 → 5. 充气转接阀安装至充气口并逆时针旋转固定 → 6. 一人扶起帐篷气柱，一人打开钢瓶充气 → 7. 充气完成移除转接阀并盖上盖子 → 8. 固定绳索于地面或稳定物体 → 9. 接上水带、排水管拉至废水收集处 → 10. 检视帐篷内排水口是否有异物堵塞 → 11. 将抽水马达置入帐篷内 → 12. 排水管线拉至废水收集处。", "html": "<h4 class=\"vsub\">6.1 防守型、进攻型方法</h4><p>依据现场事故规模，分为防守型、进攻型两种应变方式，通常会先以防守型应变行动减少暴露影响范围后，随后再进行进攻型应变行动；若时间充足允许下，两种行动皆可同时进行。</p><p>防守型应变（局限特定区域有效控制及围堵）：• 01 吸收法：借由润湿的程序使液体附著于固体，吸收剂体积随之膨胀，常以木屑、砂土方式进行吸收。• 02 吸附法：指化学品泄漏液体与中和剂表面相互吸附之方法。• 03 覆盖法：一种暂时性的控制方法，利用吸酸棉片进行覆盖。• 04 阻遏法(堤、坝、改道、截流)：以物理性阻隔法去阻止或减少外泄液流入环境的方法(NFPA)，为外泄控制最常使用的方法。• 05 蒸气驱散、压抑法：蒸气驱散法以洒水(水雾法)将蒸气驱散减低危害；蒸气压抑法使用抑制剂减少或消除发散的蒸气。</p><p>进攻型应变（使用应变器材进行止漏、关紧或其他作为）：• 01 填塞与补贴法：填塞是将物质塞入漏洞或裂缝减少泄漏；贴补是将材料黏置于洞上使化学物不漏出，一般采用夹板或黏著剂固牢。• 02 转送(移槽)法：以人工、帮浦或加压输送等方式，将液体、气体或某些型态固体由受损容器(储槽)转移至另一容器。</p><h4 class=\"vsub\">6.2 化学品泄漏围堵</h4><p>1. 穿著对应防护衣进行围堵及源头遮断，并确认漏液面积。2. 使用吸酸棉条、片由外向内、交叠进行围堵圈围，防止化学品持续扩散。3. 观察化学品泄漏源位置，围堵吓阻防止化学品溢流于低洼处。4. 止漏完成后，应使用中和剂进行环境除污，直至pH趋近于中性为止。5. 将沾染化学品吸酸棉等应变器材，装于有害废弃物处理桶(袋)并通知环保课后丢弃。</p><h4 class=\"vsub\">6.3 ERCV 注15 砲车位置及使用时机</h4><p>使用时机：1. 适用于50L以下泄漏钢瓶；2. 气体钢瓶泄漏时，ERT小组人员无法对泄漏钢瓶止漏，且有污染环境之虞时立即启用；3. 待ERCV完成操作后，立即移至户外静待厂商收回处理。</p><p>设置位置：• MTTW：FAB-B 1F南侧走道A18-8柱、FAB-C 1F资材库房走道；• MMT：A1 HPM 1F r/3柱位、A2 HPM 1F r/3柱位、A3 FAB 1F m/5柱位。</p><p>注意事项：1. 需著A级防护衣方可操作，禁止地面磨擦影响防护效力；2. 确认ERCV内部已无任何压力，否则严禁开启法兰；3. 法兰开口应朝向开阔处，且45°夹角范围内严禁人员进入；4. 需2员相互作业，勿单独行动。</p><p>禁止使用气体种类：1. 乙炔（超过 1.035 Barg 受撞或受热可能分解爆炸，不得倒置或滚动）；2. 强氧化性气体（如 N2O、ClF3、20%F2/N2、WF6）；3. 自燃性气体（如 SiH4、PH3、SiH2Cl2 等）；4. 爆炸性气体混合物（CH4、CF4、NF3、1%PH3/Ar、PGMEA、AsH3、CH2F2、CO、BF3 等）；5. 液满钢瓶；6. 仅能封装一支钢瓶。</p><p>6.3.4 ERCV Model 5503 操作流程 (20步骤)：1. 按压柄侧辅助并控制碟煞移动ERCV → 2. 马鞍放至适当位置 → 3. 检视压力表转动压力阀确认归(0) → 4. 使用T型板手旋开上方螺帽 → 5. 旋开下方螺帽 → 6. 双手旋开螺帽（若有气体喷出立即锁上，勿以手指遮盖）→ 7. 开启密闭门 → 8. 取出小钢瓶固定架及固定链条 → 9. 保护泄漏钢瓶头阀件（避免防护衣摩擦破损）→ 10. 扶正泄漏钢瓶 → 11. 转紧钢瓶保护盖（若瓶头损坏立即使用Kit止漏）→ 12. 利用马鞍支点杠杆方式放入ERCV内部 → 13. 封装时泄漏源朝下、钢瓶头朝门 → 14. 以固定链条勾住滑轨孔洞避免滑动 → 15. 密闭门关闭前后端排放阀须保持开启 → 16. 检视 O-ring 状况避免附著脏污及损坏 → 17. 锁上并以T型板手旋紧上下安全螺帽 → 18. 关闭后端排放阀，侦检确认无读值 → 19. 环境侦检读值需为0 → 20. 填写标签贴版注明泄漏化学品交由厂商清运。</p><p>6.3.5 ERCV HP 10 操作流程 (18步骤)：1. 用板手将螺帽松开后(泄压)再用手逆时钟转开 → 2. 逆时钟打开阀头进行泄压 → 3. 确认压力表头归0 → 4. 使用通用把手逆时钟转动排气螺杆 → 5. 用手逆时钟松开排气螺杆 → 6. 用通用把手逆时钟松开固定环扩张器 → 7. 将两个固定环向后拉 → 8. 将马鞍顺势取下 → 9. 将两边档板扣环取下 → 10. 钢瓶转至橡胶垫上 → 11. 利用杠杆原理将钢瓶放推入至砲车内 → 12. 推入后使用钢瓶固定板固定（需卡进钢瓶支架）→ 13. 向后拉将舱门开启（开启时人员站在门右方避免伤害）→ 14. 档板把手下拉后沿滑轨取出档板 → 15. 钢瓶放入后将档板把手往上拉固定钢瓶 → 16. 使用通用把手将舱门关回后轻推固定，顺时钟固定扩张环 → 17. 顺时钟锁上排气螺杆（需对准）→ 18. 锁上阀头及螺帽，注明化学品资讯交由厂商出场清运。</p><h4 class=\"vsub\">6.4 除污帐篷操作</h4><p>设置地点：a. 冷区上风处，暖区至冷区交接点；b. 事故现场邻近冲身洗眼器。考量事项：位置选择(上风处/水源/地势)、除污人数、除污技术类型、天气状况、设备与水源供给、仪器除污可行性。</p><p>厂区除污帐篷器材：C级防护衣、冲淋设备、吸酸棉片(条)、pH石蕊试纸、泄漏处理桶(袋)、消防水带、沉水泵、水管、清洗刷、中和剂、蓝白拖。</p><p>6.4.2 冲身洗眼器除污设置：支援组于冲身洗眼器建置除污区并铺设吸酸棉片，抢救组冲淋后使用pH试纸检测PPE趋近中性，以吸酸棉擦干并脱除PPE；随后支援组自行脱除PPE丢至泄漏处理袋(桶)。</p><p>6.4.3 除污帐篷三阶段除污：划分为三区：第一除污区（第一阶段：先使用清水及刷子清除污染物）→ 第二除污区（第二阶段：使用中和剂处理污染物，再使用清水二次清除污染物）→ 第三除污区（第三阶段：使用吸液棉擦干防护衣，并协助脱除）。</p><p>除污帐篷搭设12步骤：1. 支援组搬运除污帐篷 → 2. 摊开并确认进出方向 → 3. 将钢瓶充气转接阀安装至空气钢瓶上 → 4. 打开帐篷充气口盖子并确认逆止阀 → 5. 充气转接阀安装至充气口并逆时针旋转固定 → 6. 一人扶起帐篷气柱，一人打开钢瓶充气 → 7. 充气完成移除转接阀并盖上盖子 → 8. 固定绳索于地面或稳定物体 → 9. 接上水带、排水管拉至废水收集处 → 10. 检视帐篷内排水口是否有异物堵塞 → 11. 将抽水马达置入帐篷内 → 12. 排水管线拉至废水收集处。</p>"}, {"title": "防护衣除污及脱除", "text": "Chapter 07 防护衣除污及脱除技巧\n7.1 除污技巧认知\n快速除污：有冲身洗眼器地方，可供伤患、抢救组人员进行紧急除污作业，减少环境污染风险。\n技术除污：由支援组搭设除污帐篷，伤患、抢救组进行清水除污、中和剂除污、擦拭除污三阶段除污作业，彻底将污染物清除。\n7.2 A级防护衣脱除技巧 (9步骤)\n1. 弃置使用的应变器材 → 2. 使用清水、刷子清洗 → 3. 使用中和剂刷洗 → 4. 使用清水除去中和剂 → 5. 使用pH试纸检测趋近于中性 → 6. 刷洗A级靴底部 → 7. 使用吸酸棉进行擦拭 → 8. 脱除A级防护衣 → 9. 丢弃防护衣至桶内。\n7.3 C级防护衣脱除技巧 (9步骤)\n1. 脱除外部防护具 → 2. 撕除抗化胶带 → 3. 脱除C级帽 → 4. 拉开拉链 → 5. 脱除外层抗化手套 → 6. 由内向外卷防护衣 → 7. 防护衣丢弃至桶内 → 8. 脱除护目镜及防毒面罩 → 9. 脱除内层手套。", "html": "<h4 class=\"vsub\">7.1 除污技巧认知</h4><p>快速除污：有冲身洗眼器地方，可供伤患、抢救组人员进行紧急除污作业，减少环境污染风险。</p><p>技术除污：由支援组搭设除污帐篷，伤患、抢救组进行清水除污、中和剂除污、擦拭除污三阶段除污作业，彻底将污染物清除。</p><h4 class=\"vsub\">7.2 A级防护衣脱除技巧 (9步骤)</h4><p>1. 弃置使用的应变器材 → 2. 使用清水、刷子清洗 → 3. 使用中和剂刷洗 → 4. 使用清水除去中和剂 → 5. 使用pH试纸检测趋近于中性 → 6. 刷洗A级靴底部 → 7. 使用吸酸棉进行擦拭 → 8. 脱除A级防护衣 → 9. 丢弃防护衣至桶内。</p><h4 class=\"vsub\">7.3 C级防护衣脱除技巧 (9步骤)</h4><p>1. 脱除外部防护具 → 2. 撕除抗化胶带 → 3. 脱除C级帽 → 4. 拉开拉链 → 5. 脱除外层抗化手套 → 6. 由内向外卷防护衣 → 7. 防护衣丢弃至桶内 → 8. 脱除护目镜及防毒面罩 → 9. 脱除内层手套。</p>"}, {"title": "疏散认知", "text": "Chapter 08 厂区疏散认知\n8.1 疏散时机与定义\n1. 达火警、化学品泄漏、液体泄漏、地震、异味、台风、无尘室停电处理流程疏散标准时，即进行疏散。2. 劳工执行职务发现有立即发生危险之虞时，得在不危及其他工作者安全情形下，自行停止作业及退避至安全场所，并立即向直属主管报告。\n疏散定义：区域疏散（指同一楼层中不同作业区域间移动）、楼层疏散（指不同楼层间移动；同一回风区间则属同一楼层区块）、栋别/全厂疏散（意同全厂疏散，指人员移动离开指定建筑物）。\n8.2 广播类型与流程\n火灾广播：火警警报（确认阶段：原地静待聆听下一段广播）→ 不需疏散则继续安心工作；需要疏散则由逃生门进行疏散 → 解除阶段（状况解除返回工作岗位）。\n地震广播：厂内地震规模达四级(含)以下未达疏散标准（不需疏散继续安心工作，若有异常依监控中心广播指示）；厂内地震规模达五级以上（确认阶段：至逃生门集结 → 造成危害则由逃生门进行疏散 → 状况解除返回工作岗位）。\n其他异常广播：气体泄漏 / 异味 / 化学品泄漏 → 确认阶段（应变人员确认）→ 不需疏散继续工作 / 需要疏散则由逃生门进行疏散 → 状况解除返回工作岗位。\n8.3 疏散指引及注意事项\n指引标示：避难方向指示灯（人员行走动线或办公室内）、紧急出口指示灯（逃生梯及出入口上方）、避难逃生路线图（楼层行走动线）、户外指引标示牌（厂区外围及集结点）。\n注意事项：1. 听从引导人员指示（勿逗留嬉戏）；2. 不要搭乘电梯逃生（走逃生梯）；3. 地震疏散以手护头（防掉落物砸伤）；4. 听从指挥官指令（疏散过程需刷卡报到，原地安静等待指示直至状况解除）。\n8.4 厂区疏散集结点 (室外 / 室内)\n\n[TABLE 15 | 7 rows]\n厂区 | 8.4.1 户外集结点 (Muster Station) | 8.4.2 室内集结点（限极端恶劣天气使用）\nMTTW (F11) | • 1号集结点：第一停车场• 2号集结点：H/Q 对面篮球场 | • H/Q B1F 餐厅\nMMT (FAB16) | • 1号集结点：1号哨旁厂内道路• 2号集结点：3号哨后方 | • OB 栋 1F 餐厅\nMTB / TCP | • MTB 1号集结点：1号哨旁来宾停车场• MTB 2号集结点：P1停车场• TCP 集结点：1号哨旁、码头区旁 | • MTB：SB 栋 1F 走道• TCP：TCP 栋 1F 走道\nO2 / AATT | • 1号集结点：O2 室外集结点区域• 2号集结点：AATT 室外集结点区域 | • O2 栋 2F 走道\nW5 / O3 | • W5：室外集结点 (Muster Station 1)• O3：室外集结点 (Muster Station 1) | • 依疏散广播及现场引导人员指示集结\nMMTN | • 1号集结点：集结点1(东) 东侧• 2号集结点：集结点2(西) 西侧 | • 依疏散广播及现场引导人员指示集结\n[/TABLE]", "html": "<h4 class=\"vsub\">8.1 疏散时机与定义</h4><p>1. 达火警、化学品泄漏、液体泄漏、地震、异味、台风、无尘室停电处理流程疏散标准时，即进行疏散。2. 劳工执行职务发现有立即发生危险之虞时，得在不危及其他工作者安全情形下，自行停止作业及退避至安全场所，并立即向直属主管报告。</p><p>疏散定义：区域疏散（指同一楼层中不同作业区域间移动）、楼层疏散（指不同楼层间移动；同一回风区间则属同一楼层区块）、栋别/全厂疏散（意同全厂疏散，指人员移动离开指定建筑物）。</p><h4 class=\"vsub\">8.2 广播类型与流程</h4><p>火灾广播：火警警报（确认阶段：原地静待聆听下一段广播）→ 不需疏散则继续安心工作；需要疏散则由逃生门进行疏散 → 解除阶段（状况解除返回工作岗位）。</p><p>地震广播：厂内地震规模达四级(含)以下未达疏散标准（不需疏散继续安心工作，若有异常依监控中心广播指示）；厂内地震规模达五级以上（确认阶段：至逃生门集结 → 造成危害则由逃生门进行疏散 → 状况解除返回工作岗位）。</p><p>其他异常广播：气体泄漏 / 异味 / 化学品泄漏 → 确认阶段（应变人员确认）→ 不需疏散继续工作 / 需要疏散则由逃生门进行疏散 → 状况解除返回工作岗位。</p><h4 class=\"vsub\">8.3 疏散指引及注意事项</h4><p>指引标示：避难方向指示灯（人员行走动线或办公室内）、紧急出口指示灯（逃生梯及出入口上方）、避难逃生路线图（楼层行走动线）、户外指引标示牌（厂区外围及集结点）。</p><p>注意事项：1. 听从引导人员指示（勿逗留嬉戏）；2. 不要搭乘电梯逃生（走逃生梯）；3. 地震疏散以手护头（防掉落物砸伤）；4. 听从指挥官指令（疏散过程需刷卡报到，原地安静等待指示直至状况解除）。</p><h4 class=\"vsub\">8.4 厂区疏散集结点 (室外 / 室内)</h4><table><tr><th>厂区</th><th>8.4.1 户外集结点 (Muster Station)</th><th>8.4.2 室内集结点（限极端恶劣天气使用）</th></tr><tr><td>MTTW (F11)</td><td>• 1号集结点：第一停车场• 2号集结点：H/Q 对面篮球场</td><td>• H/Q B1F 餐厅</td></tr><tr><td>MMT (FAB16)</td><td>• 1号集结点：1号哨旁厂内道路• 2号集结点：3号哨后方</td><td>• OB 栋 1F 餐厅</td></tr><tr><td>MTB / TCP</td><td>• MTB 1号集结点：1号哨旁来宾停车场• MTB 2号集结点：P1停车场• TCP 集结点：1号哨旁、码头区旁</td><td>• MTB：SB 栋 1F 走道• TCP：TCP 栋 1F 走道</td></tr><tr><td>O2 / AATT</td><td>• 1号集结点：O2 室外集结点区域• 2号集结点：AATT 室外集结点区域</td><td>• O2 栋 2F 走道</td></tr><tr><td>W5 / O3</td><td>• W5：室外集结点 (Muster Station 1)• O3：室外集结点 (Muster Station 1)</td><td>• 依疏散广播及现场引导人员指示集结</td></tr><tr><td>MMTN</td><td>• 1号集结点：集结点1(东) 东侧• 2号集结点：集结点2(西) 西侧</td><td>• 依疏散广播及现场引导人员指示集结</td></tr></table>"}, {"title": "救护认知", "text": "Chapter 09 厂区救护认知\n9.1 保健中心介绍\n\n[TABLE 16 | 7 rows]\n厂别 | 厂名 | 保健中心位置 | 服务时间 | Teams 连络电话（市话/手机：04-2576-5119）\n桃园厂 | 一厂 (F11) | 5F | 24小时 | 5119#1\n台北/新竹 | 办公室 | 23F / 7F 柜台设置急救箱 | 仅常日班 | 5119#1\n台中厂 | FAB16 | 4F | 24小时 | 5119#2\n台中厂 | A3 | 3F | 仅常日班 | 5119#4\n台中厂 | MTB | 3F | 24小时 | 5119#3\n台中厂 | AATT | 3F | 仅常日班 | 5119#3\n[/TABLE]\n\n9.2 化学品喷溅救护\n紧急处置4步骤：1. 脱除衣物（使用安全剪刀将受污染衣物剪开减少暴露面积，使用pH试纸判定酸碱，中性液体可直接冲水）→ 2. 吸干身上化学残液（使用吸酸棉片快速擦掉）→ 3. Call Help 保健中心（立即拨打 2119 / 5119 / 7119 并告知人/事/时/地/物）→ 4. 大量清水冲淋（>15分钟，使用六腐灵 or 敌腐灵）。\n9.2.1 冲身洗眼器冲淋：• 局部喷溅眼睛：前推开启洗眼器 → 靠近洗眼器冲淋眼睛 15分钟（护理师救伤评估后送）。• 大小范围喷溅身体：脱除沾染化学品衣物 → 冲淋 15分钟 → 使用纱布覆盖患部 → 尽速送医（备妥SDS）。\n9.2.2 六腐灵、敌腐灵差异：• 六腐灵：用于氢氟酸(HF)或酸性介质氟类衍生物溅触时。皮肤外观由发红轻微水肿 → 中央变白色水泡或浅灰色、周边略带紫色环状 → 转黑紫或灰紫色伴随强烈疼痛。不同浓度 HF 疼痛与红斑延迟时间：≥50% 立即发生（迅速组织破坏）；10%~50% 延迟 0.5–6 小时；<10% 延迟 6–24 小时。• 敌腐灵：用于 TMAH 或酸碱类化学品溅触时。四甲基氢氧化铵(TMAH)危害：1. 1%以上的TMAH具有潜在健康危害(有毒性)，特别是皮肤大面积暴露；2. 高pH值(强碱)形成腐蚀性灼伤；3. 主要经由皮肤接触暴露，会作用于呼吸肌造成呼吸抑制。\n\n[TABLE 17 | 4 rows]\n项目 | 功能 | 设置地点\n500ml 六氟灵冲洗器 | HF 或含氟之化学物质 | 台中厂：冲身洗眼器 / 冲眼器 / 实验室 / 使用 HF 或含 F 化学品区域\n100ml 敌腐灵喷雾器 | 酸碱除污剂 | 台中厂：冲身洗眼器 / 冲眼器 / 实验室 / 使用强酸或强碱化学品区域\n500ml 敌腐灵冲洗器 | 酸碱除污剂 | 台中厂：TMAH operation area (PH)\n[/TABLE]\n\n9.3 AED 注16 点位、心肺复苏术 (CPR 注17 + AED)\n根据法律，对人施予急救适用免责规定。厂区 AED 配置点位摘要：\nMTTW (FAB11) AED 点位：H/Q (10F、5F Health center、3F Clean room entrance、1F Lobby、B1 Guard room)、FAB-B (5F、4F回风区、3F C/R、2F C/R、F11B BAY706、1F Door of CCR)、FAB-A / NSB (4F回风区、3F C/R、2F C/R、F11A 1F Entrance)、CUB-1 / CUB-2 (CUB-2 1F、Bonded warehouse Security Room)、FAB-C (4F回风区、3F C/R、F11C 2F Clean room entrance、F11C BAYC07、1F Door of CCR、Technology 9th Road Security Room)。\nMMT (FAB16 / A3) AED 点位：Office (1F餐厅、1F健身房、2F大厅、3F~8F C梯厅)、FAB16 (4F保健中心、A1/A2 2F~5F中央走道与无尘室电梯口、SUP栋2-1/5-1应变柜旁、SUP 1F大码头、SUP B1F电梯口、B2F南侧停车场)、CUP 2F走道、宿舍 1F柜台旁、A3 (1F大厅、3F保健中心外、2F/4F/5F c/5电梯口、B1F停车场梯厅)。\n其他厂区与 CPR+AED 流程：另包含 MTB、TCP、O2/AATT、MMTN 等各厂区大厅、保健中心及主要走道点位，以及 CPR+AED「叫、叫、压、电」标准急救步骤（确认意识呼吸 → 求救并取AED → 胸部按压100-120次/分、深度5-6公分 → 开机贴片分析电击）。\n9.4 伤患搬运救护 & 9.5 哈姆立克法救护\n9.4 伤患搬运救护：依据伤患意识状态、伤势部位与救援人数，执行单人搬运（扶持法、背负法、抱持法、拖行法）或双人/多人搬运（双人座抬法、前后抬法、担架搬运），移动时须确保呼吸道畅通并避免二次伤害。\n9.5 哈姆立克法救护：针对呼吸道异物哽塞患者：意识清醒时采站立或坐姿环抱腹部法（一手握拳拇指侧置于肚脐上方与胸骨剑突下方之间，另一手包住拳头快速向内向上挤压）；孕妇或肥胖者改压胸骨下半部；若患者失去意识则立即平躺实施 CPR。", "html": "<h4 class=\"vsub\">9.1 保健中心介绍</h4><table><tr><th>厂别</th><th>厂名</th><th>保健中心位置</th><th>服务时间</th><th>Teams 连络电话（市话/手机：04-2576-5119）</th></tr><tr><td>桃园厂</td><td>一厂 (F11)</td><td>5F</td><td>24小时</td><td>5119#1</td></tr><tr><td>台北/新竹</td><td>办公室</td><td>23F / 7F 柜台设置急救箱</td><td>仅常日班</td><td>5119#1</td></tr><tr><td>台中厂</td><td>FAB16</td><td>4F</td><td>24小时</td><td>5119#2</td></tr><tr><td>台中厂</td><td>A3</td><td>3F</td><td>仅常日班</td><td>5119#4</td></tr><tr><td>台中厂</td><td>MTB</td><td>3F</td><td>24小时</td><td>5119#3</td></tr><tr><td>台中厂</td><td>AATT</td><td>3F</td><td>仅常日班</td><td>5119#3</td></tr></table><h4 class=\"vsub\">9.2 化学品喷溅救护</h4><p>紧急处置4步骤：1. 脱除衣物（使用安全剪刀将受污染衣物剪开减少暴露面积，使用pH试纸判定酸碱，中性液体可直接冲水）→ 2. 吸干身上化学残液（使用吸酸棉片快速擦掉）→ 3. Call Help 保健中心（立即拨打 2119 / 5119 / 7119 并告知人/事/时/地/物）→ 4. 大量清水冲淋（&gt;15分钟，使用六腐灵 or 敌腐灵）。</p><p>9.2.1 冲身洗眼器冲淋：• 局部喷溅眼睛：前推开启洗眼器 → 靠近洗眼器冲淋眼睛 15分钟（护理师救伤评估后送）。• 大小范围喷溅身体：脱除沾染化学品衣物 → 冲淋 15分钟 → 使用纱布覆盖患部 → 尽速送医（备妥SDS）。</p><p>9.2.2 六腐灵、敌腐灵差异：• 六腐灵：用于氢氟酸(HF)或酸性介质氟类衍生物溅触时。皮肤外观由发红轻微水肿 → 中央变白色水泡或浅灰色、周边略带紫色环状 → 转黑紫或灰紫色伴随强烈疼痛。不同浓度 HF 疼痛与红斑延迟时间：≥50% 立即发生（迅速组织破坏）；10%~50% 延迟 0.5–6 小时；&lt;10% 延迟 6–24 小时。• 敌腐灵：用于 TMAH 或酸碱类化学品溅触时。四甲基氢氧化铵(TMAH)危害：1. 1%以上的TMAH具有潜在健康危害(有毒性)，特别是皮肤大面积暴露；2. 高pH值(强碱)形成腐蚀性灼伤；3. 主要经由皮肤接触暴露，会作用于呼吸肌造成呼吸抑制。</p><table><tr><th>项目</th><th>功能</th><th>设置地点</th></tr><tr><td>500ml 六氟灵冲洗器</td><td>HF 或含氟之化学物质</td><td>台中厂：冲身洗眼器 / 冲眼器 / 实验室 / 使用 HF 或含 F 化学品区域</td></tr><tr><td>100ml 敌腐灵喷雾器</td><td>酸碱除污剂</td><td>台中厂：冲身洗眼器 / 冲眼器 / 实验室 / 使用强酸或强碱化学品区域</td></tr><tr><td>500ml 敌腐灵冲洗器</td><td>酸碱除污剂</td><td>台中厂：TMAH operation area (PH)</td></tr></table><h4 class=\"vsub\">9.3 AED 注16 点位、心肺复苏术 (CPR 注17 + AED)</h4><p>根据法律，对人施予急救适用免责规定。厂区 AED 配置点位摘要：</p><p>MTTW (FAB11) AED 点位：H/Q (10F、5F Health center、3F Clean room entrance、1F Lobby、B1 Guard room)、FAB-B (5F、4F回风区、3F C/R、2F C/R、F11B BAY706、1F Door of CCR)、FAB-A / NSB (4F回风区、3F C/R、2F C/R、F11A 1F Entrance)、CUB-1 / CUB-2 (CUB-2 1F、Bonded warehouse Security Room)、FAB-C (4F回风区、3F C/R、F11C 2F Clean room entrance、F11C BAYC07、1F Door of CCR、Technology 9th Road Security Room)。</p><p>MMT (FAB16 / A3) AED 点位：Office (1F餐厅、1F健身房、2F大厅、3F~8F C梯厅)、FAB16 (4F保健中心、A1/A2 2F~5F中央走道与无尘室电梯口、SUP栋2-1/5-1应变柜旁、SUP 1F大码头、SUP B1F电梯口、B2F南侧停车场)、CUP 2F走道、宿舍 1F柜台旁、A3 (1F大厅、3F保健中心外、2F/4F/5F c/5电梯口、B1F停车场梯厅)。</p><p>其他厂区与 CPR+AED 流程：另包含 MTB、TCP、O2/AATT、MMTN 等各厂区大厅、保健中心及主要走道点位，以及 CPR+AED「叫、叫、压、电」标准急救步骤（确认意识呼吸 → 求救并取AED → 胸部按压100-120次/分、深度5-6公分 → 开机贴片分析电击）。</p><h4 class=\"vsub\">9.4 伤患搬运救护 &amp; 9.5 哈姆立克法救护</h4><p>9.4 伤患搬运救护：依据伤患意识状态、伤势部位与救援人数，执行单人搬运（扶持法、背负法、抱持法、拖行法）或双人/多人搬运（双人座抬法、前后抬法、担架搬运），移动时须确保呼吸道畅通并避免二次伤害。</p><p>9.5 哈姆立克法救护：针对呼吸道异物哽塞患者：意识清醒时采站立或坐姿环抱腹部法（一手握拳拇指侧置于肚脐上方与胸骨剑突下方之间，另一手包住拳头快速向内向上挤压）；孕妇或肥胖者改压胸骨下半部；若患者失去意识则立即平躺实施 CPR。</p>"}, {"title": "参考资料", "text": "Chapter 10 参考资料来源\n本指引方针依据紧急应变中心 内部标准作业程序、中华民国《消防法》及《消防法施行细则》、《职业安全卫生法》、美国消防协会标准 (NFPA)、紧急应变指南 (ERG)、美国国家职业安全与卫生研究院 (NIOSH) 规范及内政部消防署救灾技术手册编撰（涵盖注1至注17完整法规与技术名词释义）。", "html": "<p>本指引方针依据紧急应变中心 内部标准作业程序、中华民国《消防法》及《消防法施行细则》、《职业安全卫生法》、美国消防协会标准 (NFPA)、紧急应变指南 (ERG)、美国国家职业安全与卫生研究院 (NIOSH) 规范及内政部消防署救灾技术手册编撰（涵盖注1至注17完整法规与技术名词释义）。</p>"}];

<script>
(function(){
"use strict";
// 初始密码的 SHA-256 杂凑（不明文存放）；修改密码仅在本次开启内有效
var curHash = "48f2d24c91ed509539a717645f266c064e894b7efe5b391365e26558f26bdb09";
var curFnv = "8018e389"; // 备用杂凑（环境不支持 WebCrypto 时使用）
var gate = document.getElementById('gate');
var wrap = document.getElementById('mainWrap');
var gateForm = document.getElementById('gateForm');
var gatePw = document.getElementById('gatePw');
var gateErr = document.getElementById('gateErr');
var lockBtn = document.getElementById('lockBtn');
var chgBtn = document.getElementById('chgBtn');
var chgPanel = document.getElementById('chgPanel');
var chgForm = document.getElementById('chgForm');
var chgCur = document.getElementById('chgCur');
var chgNew = document.getElementById('chgNew');
var chgNew2 = document.getElementById('chgNew2');
var chgMsg = document.getElementById('chgMsg');
var chgCancel = document.getElementById('chgCancel');

function fnv1a(str){
  var h = 0x811c9dc5;
  for(var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  var s = h.toString(16);
  while(s.length < 8) s = '0' + s;
  return s;
}
function sha256Hex(str){
  if(window.crypto && crypto.subtle && window.TextEncoder){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
      var bytes = new Uint8Array(buf), hex = '';
      for(var i = 0; i < bytes.length; i++){
        var b = bytes[i].toString(16);
        if(b.length < 2) b = '0' + b;
        hex += b;
      }
      return hex;
    });
  }
  return Promise.resolve(null);
}
function checkPassword(pw){
  return sha256Hex(pw).then(function(hex){
    if(hex !== null) return hex === curHash;
    return fnv1a(pw) === curFnv;
  });
}
function setHash(pw){
  curFnv = fnv1a(pw);
  return sha256Hex(pw).then(function(hex){
    if(hex !== null) curHash = hex;
  });
}
function unlock(){
  gateErr.hidden = true;
  gatePw.value = '';
  gate.hidden = true;
  wrap.hidden = false;
}
function lock(){
  chgPanel.hidden = true;
  wrap.hidden = true;
  gate.hidden = false;
  gatePw.value = '';
  if(gatePw.focus) gatePw.focus();
}
gateForm.addEventListener('submit', function(ev){
  ev.preventDefault();
  checkPassword(gatePw.value).then(function(ok){
    if(ok){ unlock(); }
    else {
      gateErr.hidden = false;
      gatePw.select();
    }
  });
});
lockBtn.addEventListener('click', lock);
chgBtn.addEventListener('click', function(){
  chgPanel.hidden = !chgPanel.hidden;
  chgMsg.hidden = true;
  if(!chgPanel.hidden && chgCur.focus) chgCur.focus();
});
chgCancel.addEventListener('click', function(){
  chgPanel.hidden = true;
  chgForm.reset();
  chgMsg.hidden = true;
});
function chgShow(text, ok){
  chgMsg.textContent = text;
  chgMsg.className = 'chg-msg ' + (ok ? 'ok' : 'bad');
  chgMsg.hidden = false;
}
chgForm.addEventListener('submit', function(ev){
  ev.preventDefault();
  checkPassword(chgCur.value).then(function(ok){
    if(!ok){ chgShow('目前密码不正确。', false); return; }
    if(chgNew.value.length < 4){ chgShow('新密码至少要 4 个字元。', false); return; }
    if(chgNew.value !== chgNew2.value){ chgShow('两次输入的新密码不一致。', false); return; }
    setHash(chgNew.value).then(function(){
      chgForm.reset();
      chgShow('密码已修改，下次锁定后请用新密码进入。', true);
    });
  });
});
if(gatePw.focus) gatePw.focus();
})();
</script>
