<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>晶圆厂 ERC 应变知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
--bg:#eceef1; --surface:#ffffff; --surface2:#f4f6f8; --ink:#1a2230; --muted:#5a6577;
--line:#d5dae1; --accent:#b3261e; --accent-soft:#fbeae9; --amber:#8a5d00; --amber-soft:#fdf3d7;
--teal:#0f5f5c; --teal-soft:#e2f0ef; --chip:#e7ebf0; --mark:#ffe27a; --shadow:0 1px 3px rgba(16,24,40,.08);
color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
:root{
--bg:#0f1216; --surface:#171c24; --surface2:#1d232e; --ink:#e8ecf3; --muted:#9aa6b8;
--line:#2b333f; --accent:#e0574f; --accent-soft:#3a2321; --amber:#e0aa3e; --amber-soft:#38300f;
--teal:#4fb3ad; --teal-soft:#173330; --chip:#232b37; --mark:#7a6410; --shadow:0 1px 3px rgba(0,0,0,.4);
}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
a{color:var(--teal)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
img,table,pre{max-width:100%}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 56px}
h1{font-size:1.45rem;line-height:1.35;margin:4px 0 14px;font-weight:900}
.searchrow{position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0 10px}
.searchrow input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
font:inherit;font-size:16px;background:var(--surface);color:var(--ink);min-height:50px}
#count{font-size:.9rem;color:var(--muted);margin:2px 0 12px}
details.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;
margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
details.entry>summary{cursor:pointer;padding:14px 44px 14px 16px;font-weight:800;list-style:none;
display:flex;gap:10px;align-items:center;min-height:52px;position:relative}
details.entry>summary::-webkit-details-marker{display:none}
details.entry>summary::after{content:"›";position:absolute;right:16px;top:50%;
transform:translateY(-50%) rotate(90deg);font-size:1.3rem;color:var(--muted);font-weight:400}
details.entry[open]>summary::after{transform:translateY(-50%) rotate(-90deg)}
details.entry>summary:active{background:var(--surface2)}
.entry-body{padding:6px 16px 16px;border-top:1px solid var(--line);min-width:0}
.entry-body h4.vsub{margin:18px 0 6px;font-size:1rem;font-weight:800}
.entry-body p{margin:8px 0}
.entry-body table{margin:10px 0}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
border-radius:12px;overflow:hidden;font-size:.94rem}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);
overflow-wrap:break-word;min-width:0}
th{background:var(--surface2);font-weight:800}
tr:last-child td{border-bottom:0}
.blank{color:var(--amber);font-weight:700}
.lv1{color:var(--accent);font-weight:900}.lv2{color:var(--amber);font-weight:900}.lv3{font-weight:900;color:var(--teal)}
@media(max-width:640px){
table{display:block;border:0;background:transparent;overflow:visible}
table tbody{display:block}
table tr{display:block;background:var(--surface);border:1px solid var(--line);
border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
table tr:first-child:has(> th){display:none}
table td{display:block;border-bottom:1px solid var(--line);padding:9px 14px}
table td:last-child{border-bottom:0}
table td:first-child{font-weight:800;background:var(--surface2)}
}
ul.tight{margin:6px 0;padding-left:1.3em}
ul.tight li{margin:3px 0;overflow-wrap:break-word}
ol.tight{margin:6px 0;padding-left:1.4em}
ol.tight li{margin:3px 0;overflow-wrap:break-word}
.callout{border-radius:10px;padding:12px 16px;font-size:.93rem;margin:12px 0}
.callout.warn{background:var(--amber-soft);border:1px solid var(--amber)}
.callout.red{background:var(--accent-soft);border:1px solid var(--accent)}
.stage-name{font-weight:800;margin:14px 0 6px;padding:5px 10px;background:var(--surface2);
border-radius:6px;display:inline-block;font-size:.92rem;max-width:100%}
.node-list{list-style:none;margin:10px 0;padding:0}
.node-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);align-items:flex-start;flex-wrap:wrap}
.node-list li:last-child{border-bottom:0}
.ntext{min-width:0;flex:1 1 10em;overflow-wrap:break-word}
.node-list .idx{flex:0 0 auto;font-family:"Noto Sans Mono",monospace;font-size:.8rem;color:var(--muted);padding-top:3px;min-width:2em;text-align:right}
.ntype{flex:0 0 auto;font-size:.72rem;font-weight:800;border-radius:5px;padding:1px 7px;margin-top:3px;white-space:nowrap}
.ntype.start{background:var(--teal);color:#fff}
.ntype.end{background:var(--ink);color:var(--bg)}
.ntype.decision{background:var(--amber);color:#fff}
.ntype.action{background:var(--chip);color:var(--muted)}
.unit{flex:0 0 auto;font-size:.75rem;background:var(--chip);border-radius:5px;padding:1px 7px;margin-top:3px;color:var(--muted);white-space:nowrap}
li.pending .ntext{color:var(--amber)}
.pendtag{font-size:.72rem;font-weight:800;color:var(--amber);border:1px solid var(--amber);border-radius:5px;padding:0 6px;white-space:nowrap}
.branches{background:var(--surface2);border-radius:10px;padding:10px 14px;margin:12px 0}
.branches h5,.notesbox h5{margin:0 0 6px;font-size:.9rem}
.branches ul{margin:0;padding-left:1.2em;font-size:.92rem}
.notesbox{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:10px 14px;margin:12px 0}
.notesbox ul{margin:0;padding-left:1.2em;font-size:.92rem}
.check-list{list-style:none;margin:4px 0 10px;padding:0}
.check-list li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dotted var(--line);align-items:flex-start;font-size:.94rem;flex-wrap:wrap}
.check-list li:last-child{border-bottom:0}
.check-list li>span{min-width:0;overflow-wrap:break-word}
.code{flex:0 0 auto;font-family:"Noto Sans Mono",monospace;font-size:.78rem;font-weight:600;background:var(--chip);border-radius:5px;padding:1px 7px;margin-top:2px}
.ero-tree,.ero-tree ul{list-style:none;margin:0;padding-left:18px}
.ero-tree{padding-left:0}
.ero-tree li{position:relative;padding:3px 0 3px 4px;overflow-wrap:break-word}
.ero-tree ul::before{content:"";position:absolute;left:6px;top:0;bottom:8px;border-left:2px solid var(--line)}
.ero-tree>li{font-weight:900;font-size:1.05rem}
.ero-tree li li{font-weight:700}
.ero-tree li li li{font-weight:400}
pre.plantext{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:10px;
padding:14px;font-family:"Noto Sans Mono",monospace;font-size:.8rem;line-height:1.6;max-height:70vh;overflow:auto}
.flow-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin:8px 0 4px}
.flow-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);flex:0 0 auto}
.sw.start{background:var(--teal);border-color:var(--teal)}
.sw.decision{background:var(--amber-soft);border-color:var(--amber);transform:rotate(45deg);border-radius:2px;width:11px;height:11px}
.sw.end{background:var(--ink);border-color:var(--ink)}
.sw.pend{background:var(--surface);border-color:var(--amber);border-style:dashed}
.flow-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
border-radius:10px;background:var(--surface2);margin:8px 0 4px}
.flow-scroll svg{display:block}
.flow-scroll text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.flow-hint{font-size:.82rem;color:var(--muted);margin:2px 0 0}
p.note{color:var(--muted);font-size:.92rem}
[hidden]{display:none!important}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 14px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
padding:28px 24px;width:100%;max-width:360px}
.gate-card h2{margin:0 0 6px;font-size:1.25rem;font-weight:900}
.gate-card .gate-sub{margin:0 0 18px;color:var(--muted);font-size:.93rem}
.gate-form label{display:block;font-size:.9rem;font-weight:700;margin-bottom:6px}
.gate-form input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
font:inherit;font-size:16px;background:var(--surface);color:var(--ink);min-height:50px;margin-bottom:12px}
.gate-form button{width:100%;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:800;
background:var(--accent);color:#fff;min-height:50px;cursor:pointer}
.gate-form button:active{opacity:.85}
.gate-err{color:var(--accent);font-size:.9rem;font-weight:700;margin:12px 0 0}
.gatebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.gatebar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;
padding:7px 14px;font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;min-height:40px}
.gatebar button:active{background:var(--surface2)}
.chg-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
padding:16px;margin:0 0 14px}
.chg-panel h3{margin:0 0 4px;font-size:1rem;font-weight:800}
.chg-panel .chg-hint{margin:0 0 12px;color:var(--muted);font-size:.86rem}
.chg-panel label{display:block;font-size:.9rem;font-weight:700;margin:10px 0 6px}
.chg-panel input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;
font:inherit;font-size:16px;background:var(--surface);color:var(--ink);min-height:48px}
.chg-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chg-actions button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;
padding:9px 18px;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;min-height:44px}
.chg-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.chg-msg{font-size:.9rem;font-weight:700;margin:12px 0 0}
.chg-msg.ok{color:var(--teal)}
.chg-msg.bad{color:var(--accent)}
@media print{.searchrow,.gate,.gatebar,.chg-panel{display:none}details.entry{break-inside:avoid}}
</style>
</head>
<body>
<div id="gate" class="gate">
<div class="gate-card">
<h2>请输入密码</h2>
<p class="gate-sub">输入密码后即可查看知识库内容。</p>
<form class="gate-form" id="gateForm">
<label for="gatePw">密码</label>
<input type="password" id="gatePw" autocomplete="current-password" placeholder="请输入密码" />
<button type="submit">进入</button>
<p class="gate-err" id="gateErr" hidden>密码不正确，请再试一次。</p>
</form>
</div>
</div>
<div class="wrap" id="mainWrap" hidden>
<h1>晶圆厂 ERC 应变知识库</h1>
<div class="gatebar">
<button type="button" id="lockBtn">锁定页面</button>
<button type="button" id="chgBtn">修改密码</button>
</div>
<div class="chg-panel" id="chgPanel" hidden>
<h3>修改密码</h3>
<p class="chg-hint">修改仅在本次开启有效，重新打开页面后恢复初始密码。</p>
<form id="chgForm">
<label for="chgCur">目前密码</label>
<input type="password" id="chgCur" autocomplete="current-password" />
<label for="chgNew">新密码（至少 4 个字元）</label>
<input type="password" id="chgNew" autocomplete="new-password" />
<label for="chgNew2">再输入一次新密码</label>
<input type="password" id="chgNew2" autocomplete="new-password" />
<div class="chg-actions">
<button type="submit" class="primary">确认修改</button>
<button type="button" id="chgCancel">取消</button>
</div>
<p class="chg-msg" id="chgMsg" hidden></p>
</form>
</div>
<div class="searchrow"><input type="search" id="q" placeholder="搜索条目内容…" aria-label="搜索" /></div>
<p id="count"></p>
<div id="list"></div>
</div>
<script>
(function(){
"use strict";
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isPend(s){return s.indexOf('未辨清')>=0 || s.indexOf('待核')>=0;}
function hl(s, q){
var t = esc(s);
if(!q) return t;
var i = t.toLowerCase().indexOf(q.toLowerCase());
if(i<0) return t;
return t.slice(0,i) + '<mark>' + t.slice(i, i+q.length) + '</mark>' + t.slice(i+q.length);
}

function entryShell(kind, tagClass, tagText, title, meta, bodyHTML, id){
return '<details class="entry" data-kind="'+kind+'" id="'+id+'">' +
'<summary><span class="tag '+tagClass+'">'+tagText+'</span><span>'+esc(title)+'</span>' +
'<span class="tag meta">'+esc(meta)+'</span></summary>' +
'<div class="entry-body">'+bodyHTML+'</div></details>';
}

function matches(texts, q){ if(!q) return true; var low = q.toLowerCase();
return texts.some(function(t){ return t.toLowerCase().indexOf(low)>=0;});}

// ===== 主题要点 =====
var GUIDE = [
{title:'ERC 功能定位、五大功能与七大重点灾害', cat:'总览',
text:'ERC 功能定位 五大功能 ERT Audit GMS FPS 防灾 减损 人安 厂安 机安 七大重点灾害 强烈地震 台风 火灾 化学品泄漏 气体泄漏 停电 人员伤害 AMC 洁净室火灾',
html:'<span class="stage-name">ERC 五大功能</span>'
+'<table><tr><th>功能</th><th>说明</th></tr>'
+'<tr><td>ERC</td><td>负责监控厂区安全状况并提供应变设备与场地予以应变人员</td></tr>'
+'<tr><td>ERT</td><td>应变小组能正确地启动，并作出适当的行动方案</td></tr>'
+'<tr><td>Audit</td><td>厂区安全稽核能主动发掘厂内不安全因素，使工厂安全运作</td></tr>'
+'<tr><td>GMS</td><td>特殊气体监控系统：监控厂区气体供应流程与使用，避免人员暴露于危害的环境</td></tr>'
+'<tr><td>FPS</td><td>消防系统</td></tr></table>'
+'<span class="stage-name">ERC 功能定位</span>'
+'<p>防灾、减损、确保人安、厂安、机安。ERC 设置于办公室与无尘室交界处，24 小时监控厂区安全系统，必要时成立 ERT 进行紧急应变，并提供紧急应变器材供 ERT 人员应变使用。</p>'
+'<ul class="tight"><li><b>平时功能</b>：进行紧急应变训练；监督厂区环境及各项作业安全；提供相关器材借用，如可携式气体侦测器、红外线热显像仪…</li>'
+'<li><b>紧急状况功能</b>：紧急状况通报；广播人员疏散；成立 ERT 小组进行应变；提供应变器材供 ERT 应变使用</li></ul>'
+'<p>Note：ERC（Emergency Response Center）紧急应变中心、ERT（Emergency Response Team）紧急应变小组。</p>'
+'<span class="stage-name">七大重点灾害（Major Focus）</span>'
+'<ul class="tight">'
+'<li><b>强烈地震</b>：人员撤至室外；震后立即进行初步评估（已完成厂务与 ISEP 种子训练），以决定人员可否重入室内巡查〔部分字句未辨清〕</li>'
+'<li><b>台风</b>：对水电供应有威胁；加派人力驻厂值班应变</li>'
+'<li><b>火灾</b>：1. 洁净室区域火灾应立即进行现场灭火，同时人员撤出事故地点。2. 空调系统与排气系统进行应变操作：若人员直接灭火无效，火势扩大危及灭火人员，则撤出人员让自动灭火系统操作，ERT 与厂务专注于空调之操作需将烟雾局限于小区域〔部分字句未辨清〕。3. 洁净室外之火灾除自行抢救外，火势扩大应即寻求消防队支援</li>'
+'<li><b>化学品泄漏</b>：关断泄漏源、热区隔离人员，配备必要防护衣具再抢救；排出液体或冲洗排水勿入明沟造成环保问题；注意 chemical 对 wafer 的后续污染问题（即 AMC）</li>'
+'<li><b>气体泄漏</b>：关断泄漏源、热区紧急撤离人员，先确认人员安全与全力抢救伤患；配备必要防护衣具再抢救、再确认认定事故真因，人员重回工作岗位</li>'
+'<li><b>停电</b>：厂务确保紧急电源相关系统与 Life safety &amp; exhaust 系统运作正常；ISEP 确认 gas alarm 状况，fab 端当作泄漏救 wafer〔末句部分字句未辨清〕</li>'
+'<li><b>人员伤害</b>：厂内人员发生身体不适或伤害时，第一时间进行紧急救援，并依照人员伤害通报程序进行通报〔句首一字未辨清〕</li></ul>'},

{title:'ERC 值班台安排（双值班台・每班五员）', cat:'值班',
text:'值班台安排 On duty console arrangement 双 ERC 值班台 平面图 FAB 应变着装区 紧急应变集结区 厂商作业区 换鞋区 PPE 着装区 前进指挥站 P1 P2 P3 每班五员 电子看板 ESP 上线 Check list 28 项 天然灾害 地震 压降',
html:'<span class="stage-name">ERC 平面图标示</span>'
+'<p>FAB、应变着装区、P2/P3 紧急应变集结区、P1 紧急应变集结区、ERC、厂商作业区、换鞋区。</p>'
+'<span class="stage-name">F18A ERC 规划说明</span><ol class="tight">'
+'<li>双 ERC 值班台，同一时间可处理两件异常，两边值班台监控功能一致（可监控 P1~P3）</li>'
+'<li>一个 PPE 着装区并设置 P2 无尘室前进指挥站</li>'
+'<li>P1 值班区主要处理天然灾害 ex 地震、压降…</li>'
+'<li>P2/3 值班区主要处理现场异常 ex Gas、Chemical…</li>'
+'<li>人员编制每班五员：P2/3 三员 &amp; P1 二员，并订定 ERC 值班工作 R&amp;R 及紧急应变 R&amp;R</li>'
+'<li>紧急应变采用电子看板辅助</li>'
+'<li>ESP 上线：a. 每日自动报表自动产出；b. ERC 器材借出 e 化；c. ERC 点检 e 化</li>'
+'<li>建置 F18A ERC 紧急应变 Check list（共 28 项）</li></ol>'},

{title:'ERC 监控设备、应变器材与设施（第二 ERC／前进指挥站／4G 摄影机／视讯站）', cat:'设施',
text:'监控设备 VESDA GMS CCTV A 级防护衣 消防衣 紧急遮断盘 第二 ERC 备援 卫星电话 笔记型电脑 前进指挥站 250m 10 分钟 Giga FAB 4G 行动摄影机 视讯站 5 个',
html:'<span class="stage-name">监控设备与紧急应变器材</span>'
+'<p>紧急监控系统：VESDA、GMS、CCTV。紧急应变器材：A 级防护衣、消防衣、紧急遮断盘。</p>'
+'<span class="stage-name">第二 ERC 建置（ERC 备援）</span>'
+'<p>ERC 于紧急应变过程中是应变讯息之连络中心，IC（指挥官）在 ERC 可借以了解厂内事件状况，统筹指挥与协调意外事件救灾相关事宜；当事故规模扩大到会危及到 ERC 内人员安全，就必须启动第二 ERC 来继续统筹、指挥并发挥紧急应变中心的功能。</p>'
+'<p>tsmc 第二 ERC 设置规范：</p><ol class="tight">'
+'<li>可监控厂内消防系统与气体侦测系统状态</li>'
+'<li>设置实体电话线与电话</li>'
+'<li>设置二台笔记型电脑</li>'
+'<li>各类紧急应变器材</li>'
+'<li>设置卫星电话</li></ol>'
+'<p>（第二 ERC 实景照片日期戳 18/12/2020。）</p>'
+'<span class="stage-name">前进指挥站（强化远距紧急应变能量）</span>'
+'<p><b>目的</b>：F18A 因应目前 Giga FAB 厂区占地辽阔、整并纵深过长，为确保 ERT 成员有效远距紧急应变，设置前进指挥站有效运用资源处理灾害，将 ERT 应变能量有效延伸。</p>'
+'<p><b>做法</b>：定义前进指挥所离 ERC 距离或重装备行走需花费时间：距离 ERC &gt; 250m；重装备（A 级防护衣，消防衣）行走需花费 &gt; 10mins。</p>'
+'<p><b>解决远距应变的问题</b>：降低救灾应变范围有效人力运用及对厂区的影响；有效应用救灾器材，确保人员安全。</p>'
+'<p>厂区平面图标示 P2、P3、SUP、P1、B1 及数字 230、212、230、6〔平面图细部标注部分未辨清〕；照片标签：ERC、前进指挥站、前进指挥站视讯系统。</p>'
+'<span class="stage-name">4G 行动摄影机</span>'
+'<p><b>目的</b>：厂区每日风险性施工或紧急状况处理等因素，目前因受限于 CCTV 覆盖率因素，导致容易有盲点无法即时掌握现场状况，因此设置 4G 行动摄影机可即时监控与风险性施工或紧急状况处理。</p>'
+'<p><b>创新</b>：使用 4G 通讯，即时传送影像到紧急应变中心（ERC）。<b>使用方式</b>：设置于防护衣外，可将眼前画面回传 ERC。（照片时间戳 2021/01/01 16:12:07，穿戴防护衣影像回传画面。）</p>'
+'<span class="stage-name">视讯功能</span>'
+'<p>F18A 共有：ERC、前进指挥站、P1 厂务值班室、P2 厂务值班室、P3 厂务值班室，共 5 个紧急应变视讯站，可以视讯系统做多方即时通联。照片标签：P2 ERC、前进指挥站、P2 厂务值班、P1 厂务值班。</p>'},

{title:'紧急应变训练年度活动（ERT 训练・季演练・年度排程）', cat:'训练',
text:'紧急应变训练 年度活动 ERT 训练 PPE 穿戴 紧急应变演训 消防灭火 Q1 Q2 Q3 Q4 季演练 H.A.Z.M.A.T 无预警集结 年度疏散暨应变演练 竹山消防训练 年度消防训练 SCBA',
html:'<span class="stage-name">ERT 训练</span><ol class="tight"><li>PPE 穿戴训练</li><li>紧急应变演训</li><li>消防灭火训练</li></ol>'
+'<span class="stage-name">年度活动排程</span>'
+'<p>ISEP ERC 每年排定各类紧急应变训练与演练，持续提升应变技能：</p><ul class="tight">'
+'<li><b>Q1</b>：PPE 穿戴练习 — 训练厂内 ERT 人数 &gt;1000 人（EE/FAC）；另有「竹山消防训练」</li>'
+'<li><b>Q2</b>：紧急应变演练、疏散演练 — 举办 50 场以上演练（含预演）</li>'
+'<li><b>Q3</b>：紧急应变演练 — 举办 50 场以上演练（含预演）；另有「年度消防训练」</li>'
+'<li><b>Q4</b>：年度疏散暨应变演练 — 举办 5 场以上演练（含预演）</li></ul>'
+'<p>小图标题「ERT PPE Training」，图内红色小字标签可辨「训练衣、A 级衣 + SCBA + 无线电」等字样〔其余小字未辨清〕。</p>'
+'<span class="stage-name">ERT 季演练</span>'
+'<p>借由实兵演练让 ERT 成员实际以 H.A.Z.M.A.T. 进行救灾，模拟厂区发生各类灾害应变，强化 ERT 应变能力与符合各类法规要求。照片标签（八张）：ERT Team up、火灾演练－无尘室、火灾演练－无尘室、火灾演练－非无尘室、毒化物演练、毒化物处理、ERT 无预警集结演练、化学品泄漏演练。</p>'
+'<span class="stage-name">年度疏散暨应变演练</span>'
+'<p>照片标签：厂务部发电机火灾演练、蚀刻部门毒气泄漏演练、EMT 伤患救援、全厂疏散演练。</p>'},

{title:'ERC 值班规定：开门七件事与值班分工 R&R', cat:'值班',
text:'开门七件事 值班规定 日常管理 值班名牌 系统隔离 NCS VESDA GMS 器材 状况交接 班长 副班长 班员 人力安排 无线电 视讯 Level-1 登录 值班分工 R&R ERIC CAR EEM 六氟灵 敌腐灵 CO2 变电站 电话三声',
html:'<span class="stage-name">开门七件事（ERC 日常管理）</span><ol class="tight">'
+'<li>值班名牌更换，ERC 环境整理及 PPE 整理</li>'

+'<li>检查并确认器材状况正常（纸带，P/D，各式器材）</li>'
+'<li>值班状况交接（Case）</li>'
+'<li>班长 ERC 人力及工作安排（1.C/R 2.Non-C/R 3.Level-1 4.紧急状况处理）</li>'
+'<li>测试并确认无线电通联，紧急视讯系统状况正常</li>'
+'<li>管理局特定 Level-1 作业登录</li></ol>'
+'<span class="stage-name">值班分工 R&amp;R — 原则</span>'
+'<p>人员配置原则：依值班分工分配每日例行工作，以利同仁明确清楚自己每日值班的职掌。定义 ERC 开门七件事，需要在值班交接前完成确认（已分配于以下分工 List）：1. 值班名牌更换，ERC 环境整理及 PPE 整理；2. 各 Site 正手执行检查并确认系统隔离，解隔离状态正常（NCS/VESDA/GMS）；3. 检查并确认器材状况正常（纸带，手持式侦测器，各式器材）；4. 值班状况交接（Case）；5. 班长 ERC 人力及工作安排；6. 测试并确认无线电通联，紧急视讯系统状况正常；7. 管理局特定 Level-1 作业登录。</p>'
+'<div class="callout warn">Note：P1~P3 系统只要有警报都要立即确认，电话严禁响超过三声才接听。</div>'
+'<span class="stage-name">班长（P2）分工</span><ol class="tight">'
+'<li>值班人力安排（名牌更换）</li>'
+'<li>Alarm phone call 调查</li>'
+'<li>Mail：Daily audit report、ERIC 未结案、假日高风险施工申请、每日特气送气登纪检查表</li>'
+'<li>缺失确认并送出（CAR/EEM）</li></ol>'
+'<span class="stage-name">副班长（P1）分工</span><ol class="tight">'
+'<li>ERIC 例行登录</li>'
+'<li>Mail：厂内 Daily 值班纪录</li>'
+'<li>晚会交接（16:30 简讯通知）</li>'
+'<li>晨会交接厂内/各厂异常报告整理 PPT</li></ol>'
+'<span class="stage-name">班员（P1）分工</span><ol class="tight">'
+'<li>交接前确认器材借出归还情况</li>'
+'<li>4G 摄影机、T-Phone、值班手机充电</li>'
+'<li>VMB 送酸，夜加查核</li>'
+'<li>每日施工报表制作</li>'
+'<li>每日 Level-1、设备高风险查核、PM 巡检</li>'
+'<li>晨会交接操盘</li>'
+'<li>六氟灵 &amp; 敌腐灵点检（P1）</li></ol>'
+'<span class="stage-name">班员（P2）分工</span><ol class="tight">'
+'<li>值班状况回报 &amp; 简讯发送</li>'
+'<li>Mail：厂商夜间作业申请统计、ERC 上网申报〝南科管理局</li>'
+'<li>南科管理局特殊作业申报</li>'
+'<li>每日 Level-1、设备高风险查核、PM 巡检（支援）</li>'
+'<li>晨会交接操盘</li>'
+'<li>六氟灵 &amp; 敌腐灵点检（P2）</li></ol>'
+'<span class="stage-name">班员（P3）分工</span><ol class="tight">'
+'<li>ERC Room 6S 环境整理、器材检点、PPE 整理、相机借用</li>'
+'<li>CO2 变电站解隔离</li>'
+'<li>每日 Level-1、设备高风险查核、PM 巡检</li>'
+'<li>晨会交接操盘</li>'
+'<li>六氟灵 &amp; 敌腐灵点检（P3）</li></ol>'},

{title:'ERC 紧急应变 R&R（班长／副班长／班员职责）', cat:'应变',
text:'紧急应变 R&R 启动时机 Team up 班长 副班长 班员 职责 IC Checklist 环境量测 点位确认 CCTV 简讯发送 报告撰写 ISEP Account Leader 4G 摄影 安播广播',
html:'<span class="stage-name">启动与配置原则</span><ul class="tight">'
+'<li><b>启动时机</b>：任何异常或持续之气体读值、火警警报、漏液、化学品沾染、人员受伤通报...等应变</li>'
+'<li><b>人员配置原则</b>：应变时原则上班长在 ERC 指挥，副班长负责现场，特殊情况班长与副班长可对调，并请求 Leader 支援</li>'
+'<li><b>全员协同应变</b>：应变时打破 P1~P3 编制限制，人力抽调加入应变，由班长统筹指挥 ERC 及现场应变人力，现场应变人力需资深人员搭配浅人员（日班发生时，当日人员需第一时间加入配合班长之指挥应变）</li>'
+'<li><b>ERC Team up</b>：状况达异常等级或持续性不正常状况，班长要求 IC 至 ERC 了解状况 Team up，使用 IC check list</li>'
+'<li><b>现场 Team up</b>：现场处理重点为人员安全、现场管制、环境侦测、状况回报，要求责任单位 Team up，使用 4G 摄影</li>'
+'<li><b>事故处理及原因调查</b>：由权责单位负责，ISEP Account sponsor/ERC 成员给予必要之安全协助</li></ul>'
+'<span class="stage-name">班长（P2）职责</span><ol class="tight">'
+'<li>统筹应变指挥分工</li>'
+'<li>请副班长及一位班员配合现厂应变</li>'
+'<li>协助 IC 在 ERC Team up 填写 IC Checklist</li>'
+'<li>指挥留守 ERC 班员启动通报程序</li></ol>'
+'<span class="stage-name">副班长（P1）职责</span><ol class="tight">'
+'<li>现场应变，回报班长现场状况</li>'
+'<li>现场救灾组 Team up</li>'
+'<li>指挥环境量测、点位确认</li>'
+'<li>确认现场人员安全</li>'
+'<li>建议穿戴适当的 PPE</li></ol>'
+'<span class="stage-name">班员（P1）职责</span><ol class="tight">'

{title:'ISEP 巡检计划（PDCA）、巡检强化与建物安全责任区', cat:'巡检',
text:'ISEP 巡检计划 PDCA Level 1 开工巡检 Level 2 例行抽检 装机作业查核 建物责任区 主题式巡检 逐月排程 小蜜蜂 装机巡检强化 稽核能力提升 W203 W212 Action 四特管 建物安全员责任区分配 郭川铭 陈圣旺 小房间矩阵 装机机台分布图 例行性巡检路线',
html:'<span class="stage-name">ISEP 巡检计划 — PDCA</span>'
+'<p>目的：为减少厂区重度缺失、持续加强作业安全，以达到防灾减损为目的。Follow up：ERC 周、月报检讨。</p>'
+'<table><tr><th>#</th><th>类别</th><th>执行人员</th><th>执行方式</th></tr>'
+'<tr><td>1</td><td>Level 1 开工巡检</td><td>ERC 副手（EUV 为主）</td><td>开工检查 100%</td></tr>'
+'<tr><td>2</td><td>Level 2 例行抽检</td><td>ERC 副手</td><td>每日抽查 20%</td></tr>'
+'<tr><td>3</td><td>装机作业查核</td><td>ERC 副手</td><td>每日抽查 6 件</td></tr>'
+'<tr><td>4</td><td>区域例行性巡检</td><td>ERC 副手（夜班）</td><td>依规划路线</td></tr>'
+'<tr><td>5</td><td>建物责任区巡检</td><td>ERC（加班）</td><td>区域负责人每月 1 次专案巡检</td></tr>'
+'<tr><td>6</td><td>常态式主题稽核</td><td>ESH 工程师</td><td>槽车灌充作业 &gt;10%、开盘作业查核 &gt;30%</td></tr>'
+'<tr><td>7</td><td>高风险区域施工巡检</td><td>ESH 工程师</td><td>抽查每日区域 &gt;20%</td></tr>'
+'<tr><td>8</td><td>主题式巡检</td><td>ERC 副手</td><td>依排定计划对厂区进行（计划类与时事类）</td></tr></table>'
+'<p>备份简报版本差异：第 6、7 类执行人员作「小蜜蜂」，执行方式作「小蜜蜂槽车灌充作业 &gt;10%、小蜜蜂开盘作业查核 &gt;30%」与「小蜜蜂抽查每日区域 &gt;20%」，其余相同。</p>'
+'<span class="stage-name">主题式巡检排程（与安全工程师讨论后排定）</span>'
+'<table><tr><th>月</th><th>主题稽核（计划）</th><th>主题稽核（滚动）</th></tr>'
+'<tr><td>1 月</td><td>年度防震设备检查</td><td>高架地板开口</td></tr>'
+'<tr><td>2 月</td><td>梯凳 &amp; A 字梯检查</td><td>防火填塞</td></tr>'
+'<tr><td>3 月</td><td>Safety interlock 安全查核（厂务/设备）</td><td>禁水发火〔未辨清〕</td></tr>'
+'<tr><td>4 月</td><td>槽车灌充作业</td><td>地震防护</td></tr>'
+'<tr><td>5 月</td><td>安全锚锭查核（防坠/吊具/推车）〔部分未辨清〕</td><td>自动门螺丝〔未辨清〕</td></tr>'
+'<tr><td>6 月</td><td>VMB、G/C、LDS 安全查核（LOTO）</td><td>Fire load</td></tr>'
+'<tr><td>7 月</td><td>防火区划检查</td><td>避难逃生</td></tr>'
+'<tr><td>8 月</td><td>长期存放区/短期暂存区检查（fire loading）</td><td>LDS 气柜</td></tr>'
+'<tr><td>9 月</td><td>疏散动线检查</td><td>高架作业</td></tr>'
+'<tr><td>10 月</td><td>安全门、防火门功能检查</td><td>动火作业</td></tr>'
+'<tr><td>11 月</td><td>Local supply 钢瓶、Drum 桶、药剂更换检查〔部分未辨清〕</td><td>LOTO</td></tr>'
+'<tr><td>12 月</td><td>槽车灌充作业</td><td>SDS</td></tr></table>'
+'<p>备份简报版本差异：5 月计划栏作「安全锚锭检查（防夹块/吊具/推车）」、11 月作「Local supply 钢瓶、Drum 桶、药品更换作业」；滚动栏仅显示 1 月「高架地板开口」，其余月份栏位在该页画面未显示文字。</p>'
+'<span class="stage-name">装机巡检强化专案</span>'
+'<p>目的：掌握厂内装机状况，提升装机巡检效率。方法：</p><ul class="tight">'
+'<li>[倩瑜] 每双周更新装机清单、Layout &amp; 巡检排程</li>'
+'<li>[ERC] 每班依排程巡检（包含主机台 &amp; Sub-Fab 相对应位置），并填写巡检记录</li>'
+'<li>检查（01）重点 — 日班：施工纪律 — 施工单/工具箱会议/三巡表、高架/开口/搬运作业防护、有机溶剂/电器使用安全；夜班：环境安全 — 开口防护/标示、物料摆放整齐/减少 Fire Loading、逃生动线畅通、无阻挡消防设施</li>'

text:'疏散程序规定 地震 震度 gal 无尘室疏散 TE key in Vendor 清洁人员 餐厅 SUP 码头 设备工程师 ERC 成立 ERT 气体警报 GMS HiHi Alarm 火灾 停电 Life Safety 集合点 Office FAB CUP 逃生楼梯 电梯 ERC 广播',

+'<tr><td>气体警报</td><td>GMS 读值达到 HiHi Alarm</td><td>疏散</td><td>1. 无尘室 TE key in 2. Vendor &amp; 清洁人员：餐厅 3. 设备工程师：ERC 成立 ERT</td></tr>'

lanes.forEach(function(u){ cursor[u]=PAD+HEAD+8; });
order.forEach(function(n){
var g=geom[n.id];
var y = Math.max(cursor[n.unit], PAD+HEAD+8 + level[n.id]*MINROW);
var x = PAD + laneIdx[n.unit]*(BW+GAPX);
pos[n.id]={x:x, y:y, w:g.w, h:g.h, cx:x+g.w/2, cy:y+g.h/2};
cursor[n.unit]= y + g.h + VGAP;
});
var W = PAD*2 + lanes.length*BW + (lanes.length-1)*GAPX;
var H = 0;
lanes.forEach(function(u){ H=Math.max(H, cursor[u]-VGAP+PAD); });
var mid='fm'+fi;
var s='';
s+='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(f.title)+'流程图">';
s+='<defs><marker id="'+mid+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs>';
// lane bands
lanes.forEach(function(u,i){
var x=PAD+i*(BW+GAPX);
s+='<rect x="'+(x-6)+'" y="'+PAD+'" width="'+(BW+12)+'" height="'+(H-PAD*2)+'" rx="10" fill="var(--surface)" opacity="0.55"></rect>';
s+='<text x="'+(x+BW/2)+'" y="'+(PAD+22)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--muted)">'+esc(u)+'</text>';
});
// edges
f.edges.forEach(function(e){
var a=pos[e.s], b=pos[e.t]; if(!a||!b) return;
var d;
if(b.y > a.y + 4){
var my = a.y + a.h + (b.y-(a.y+a.h))/2;
d='M'+a.cx+' '+(a.y+a.h)+' V'+my+' H'+b.cx+' V'+(b.y-2);
} else {
var rx = Math.max(a.x+a.w, b.x+b.w) + 26;
d='M'+(a.x+a.w)+' '+a.cy+' H'+rx+' V'+b.cy+' H'+(b.x+b.w+2);
}
s+='<path d="'+d+'" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#'+mid+')"></path>';
if(e.l){
var lx, ly;
if(b.y > a.y + 4){ lx=(a.cx+b.cx)/2; ly=a.y+a.h+(b.y-(a.y+a.h))/2 - 5; }
else { lx=Math.max(a.x+a.w, b.x+b.w)+26; ly=(a.cy+b.cy)/2 - 5; }
var lw=e.l.length*13+10;
s+='<rect x="'+(lx-lw/2)+'" y="'+(ly-11)+'" width="'+lw+'" height="16" rx="4" fill="var(--surface)"></rect>';
s+='<text x="'+lx+'" y="'+(ly+1)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent)">'+esc(e.l)+'</text>';
}
});
// nodes
f.nodes.forEach(function(n){
var p=pos[n.id], g=geom[n.id];
var pend = n.rec!=='REVIEWED' || n.text.indexOf('未辨清')>=0;
var dash = pend? ' stroke-dasharray="6 4"' : '';
var strokeW = n.kind==='decision'? '2.2':'1.6';
if(n.kind==='decision'){
var cx=p.cx, cy=p.cy;
s+='<polygon points="'+cx+','+p.y+' '+(p.x+p.w)+','+cy+' '+cx+','+(p.y+p.h)+' '+p.x+','+cy+'" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="'+strokeW+'"'+dash+'></polygon>';
} else if(n.kind==='start'){
s+='<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="22" fill="var(--teal)" stroke="var(--teal)" stroke-width="1.6"'+dash+'></rect>';
} else if(n.kind==='end'){
s+='<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="10" fill="var(--ink)" stroke="var(--ink)" stroke-width="1.6"'+dash+'></rect>';
} else {
s+='<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="'+strokeW+'"'+dash+'></rect>';
}
var dark = (n.kind==='start'||n.kind==='end');
var unitFill = dark? 'rgba(255,255,255,.75)' : 'var(--muted)';
var textFill = dark? '#ffffff' : 'var(--ink)';
var ty = p.y + 20;
s+='<text x="'+p.cx+'" y="'+ty+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="'+unitFill+'">'+esc(n.unit)+'</text>';
g.lines.forEach(function(ln, li){
s+='<text x="'+p.cx+'" y="'+(ty+16+li*17)+'" text-anchor="middle" font-size="12.5" fill="'+textFill+'">'+esc(ln)+'</text>';
});
if(pend){
s+='<text x="'+(p.x+p.w-4)+'" y="'+(p.y-5)+'" text-anchor="end" font-size="10.5" font-weight="800" fill="var(--amber)">待核</text>';
}
});
s+='</svg>';
FLOW_SVG_CACHE[fi]=s;
return s;
}
function flowBody(f, fi){
var h='<div class="flow-legend"><span><i class="sw start"></i>起点</span><span><i class="sw"></i>步骤</span><span><i class="sw decision"></i>判断</span><span><i class="sw end"></i>结束</span><span><i class="sw pend"></i>待核（字句未辨清）</span></div>';
h+='<div class="flow-scroll">'+flowSVG(f, fi)+'</div>';
h+='<p class="flow-hint">图中栏位依执行单位分列；箭头上的红字为判断分支。图面较宽时可在此框内左右滑动查看。</p>';
if(f.notes && f.notes.length){
h+='<div class="notesbox"><h5>注记（待核）</h5><ul>';
f.notes.forEach(function(t){ h+='<li>'+esc(t)+'</li>'; });
h+='</ul></div>';
}
return h;
}

// ===== ERO 组织图（图形呈现：方框节点＋连接线的树状编组图） =====
var ERO = {title:'紧急应变组织（ERO）', ver:'1', nodes:[
{id:'ic', p:null, t:'事故指挥官'},
{id:'public', p:'ic', t:'公关'},
{id:'finance', p:'ic', t:'财务'},
{id:'safety', p:'ic', t:'安全官'},
{id:'support', p:'ic', t:'支援组长'},
{id:'aid', p:'ic', t:'急救组'},
{id:'rescue', p:'ic', t:'救灾组长'},
{id:'evac', p:'ic', t:'疏散组长'},
{id:'facility', p:'ic', t:'厂务组长'},
{id:'control', p:'ic', t:'管制组长'},
{id:'support-1', p:'support', t:'支援组员'},
{id:'support-2', p:'support', t:'支援组员'},

{id:'rescue-4', p:'rescue', t:'抢救4组'},
